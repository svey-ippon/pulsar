[project]
name = "pulsar-bare-ui"
version = "0.1.0"
description = "Streamlit UI for the 'bare' raw-SQL Snowflake agent"
requires-python = "~=3.14.2"
dependencies = [
    "pulsar-bare-agent",
    "pandas>=2.2",
    "streamlit>=1.35",
]

[project.scripts]
pulsar-bare-ui = "pulsar_bare_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_bare_ui"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
pulsar-bare-agent = { workspace = true }
