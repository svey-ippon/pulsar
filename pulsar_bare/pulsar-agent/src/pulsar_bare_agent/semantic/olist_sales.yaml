version: 2

domain:
  id: olist_sales
  name: Olist Sales Analytics
  description: >
    Certified gold-layer domain for the Olist Brazilian e-commerce dataset, modeled as a pure
    Kimball star: thin facts (orders, order items, payments, reviews) carrying only keys and
    measures, conformed dimensions (date, customer, geography, category, product, seller), and a
    keys-only order/category bridge. Analytical attributes are reached through joins, not
    denormalized onto the facts.
  database: PULSAR_DB
  schema: GOLD
  owner: pulsar_poc

query_surface:
  allowed_database: PULSAR_DB
  allowed_schema: GOLD
  allowed_object_types: [ TABLE, VIEW ]
  max_result_rows: 1000
  default_limit_for_detail_queries: 100
  conventions:
  - 'Revenue means MERCHANDISE revenue: SUM(ITEM_REVENUE) on FCT_ORDER_ITEMS (excludes freight). It is NOT payment value.'
  - 'Collected value means SUM(PAYMENT_VALUE) on FCT_ORDER_PAYMENTS (includes freight and adjustments).'
  - '"Customers" means physical customers (CUSTOMER_UNIQUE_ID) unless the question is clearly about orders. CUSTOMER_ID is order-scoped.'
  - 'Delivery status is DERIVED from FCT_ORDERS.DELAY_DAYS (no stored status column): NULL = not delivered; <= 0 = on_time; 1..7 = late; > 7 = very_late. A "late delivery" is DELAY_DAYS > 0. "Delivered orders" are DELAY_DAYS IS NOT NULL.'
  - 'A "negative review" is REVIEW_SCORE <= 2 (no stored flag).'
  - 'Item value including freight is ITEM_REVENUE + FREIGHT_VALUE (not stored).'
  - 'Installment buckets (when asked) derive from PAYMENT_INSTALLMENTS: 1 = single, 2-3, 4-6, 7-12, 13+.'
  - 'Dates: facts carry *_DATE_KEY columns of type DATE. For simple time grouping (month, year) apply DATE_TRUNC/YEAR directly on the date key. Join DIM_DATE only when a calendar attribute is needed (day name, weekend, week of year). FCT_ORDER_ITEMS carries NO order date: any time-based item/revenue analysis must join FCT_ORDERS on ORDER_ID.'
  - 'Category: the canonical category key is the Portuguese PRODUCT_CATEGORY_NAME; the English name lives in DIM_CATEGORIES.PRODUCT_CATEGORY_NAME_ENGLISH (may be null when untranslated).'

tables:
- id: fct_orders
  qualified_name: PULSAR_DB.GOLD.FCT_ORDERS
  type: FACT
  business_name: Orders
  description: >
    Order fact at ORDER_ID grain (accumulating snapshot of the order lifecycle). Thin fact: keys,
    degenerate dimensions, and delivery-delay measures. Customer, geography and calendar
    attributes are reached through DIM_CUSTOMERS, DIM_GEOGRAPHY and the date keys.
  primary_key: [ ORDER_ID ]
  default_date_column: ORDER_PURCHASE_DATE_KEY
  recommended_alias: fo
  warnings:
  - One order can have many items, payments and (rarely) reviews. When FCT_ORDERS is joined to any of those, count orders with COUNT(DISTINCT fo.ORDER_ID), never COUNT(*).
  columns:
  - { name: ORDER_ID, type: VARCHAR, role: PRIMARY_KEY, description: Unique order identifier (degenerate dimension shared by all order-grain facts). }
  - { name: CUSTOMER_UNIQUE_ID, type: VARCHAR, role: FOREIGN_KEY, description: Physical customer., references: { table: dim_customers, column: CUSTOMER_UNIQUE_ID } }
  - { name: CUSTOMER_ZIP_CODE_PREFIX, type: VARCHAR, role: FOREIGN_KEY, description: Customer zip prefix for this order (customer-location role of geography)., references: { table: dim_geography, column: ZIP_CODE_PREFIX } }
  - { name: ORDER_PURCHASE_DATE_KEY, type: DATE, role: DATE, description: Purchase date (default date for time analysis)., references: { table: dim_date, column: DATE_DAY } }
  - { name: ORDER_APPROVED_DATE_KEY, type: DATE, role: DATE, description: Approval date (null until approved)., references: { table: dim_date, column: DATE_DAY } }
  - { name: ORDER_DELIVERED_CARRIER_DATE_KEY, type: DATE, role: DATE, description: Carrier-handoff date (null until handed off)., references: { table: dim_date, column: DATE_DAY } }
  - { name: ORDER_DELIVERED_CUSTOMER_DATE_KEY, type: DATE, role: DATE, description: Delivery-to-customer date (null if not delivered)., references: { table: dim_date, column: DATE_DAY } }
  - { name: ORDER_ESTIMATED_DELIVERY_DATE_KEY, type: DATE, role: DATE, description: Estimated delivery date., references: { table: dim_date, column: DATE_DAY } }
  - { name: CUSTOMER_ID, type: VARCHAR, role: DEGENERATE_DIMENSION, description: Order-scoped customer key (one per order). Use CUSTOMER_UNIQUE_ID for physical customers. }
  - { name: ORDER_STATUS, type: VARCHAR, role: FILTER, description: 'Order status (delivered, shipped, canceled, ...).' }
  - { name: ORDER_PURCHASE_TIMESTAMP, type: TIMESTAMP_NTZ, role: DATE, description: Purchase event time (intra-day precision / recency ordering). }
  - { name: DELAY_DAYS, type: NUMBER, role: MEASURE, description: 'Delivered minus estimated delivery, in days. NULL = not delivered, > 0 = late. Delivery status derives from this column (see conventions).' }
  - { name: APPROVAL_DELAY_DAYS, type: NUMBER, role: MEASURE, description: Days between purchase and approval. }
  - { name: PURCHASE_TO_DELIVERY_DAYS, type: NUMBER, role: MEASURE, description: Days between purchase and delivery to customer. }

- id: fct_order_items
  qualified_name: PULSAR_DB.GOLD.FCT_ORDER_ITEMS
  type: FACT
  business_name: Order items
  description: >
    Order-item fact at (order_id x order_item_id) grain — the base table for merchandise revenue.
    Thin fact: product/seller/order keys and money measures only. Category, seller geography and
    order dates are reached through joins.
  grain: One row per order item (order_id x order_item_id).
  primary_key: [ ORDER_ITEM_KEY ]
  recommended_alias: foi
  warnings:
  - Multiple item rows per order. To count orders use COUNT(DISTINCT foi.ORDER_ID), never COUNT(*).
  - This table carries NO date column for the order. Any time-based revenue analysis must join FCT_ORDERS on ORDER_ID and use its date keys.
  - For merchandise revenue by category, join DIM_PRODUCTS (then DIM_CATEGORIES for the English name) and group by the product category.
  columns:
  - { name: ORDER_ITEM_KEY, type: VARCHAR, role: PRIMARY_KEY, description: Synthetic key (order_id-order_item_id). }
  - { name: ORDER_ID, type: VARCHAR, role: FOREIGN_KEY, description: Order identifier., references: { table: fct_orders, column: ORDER_ID } }
  - { name: PRODUCT_ID, type: VARCHAR, role: FOREIGN_KEY, description: Product identifier., references: { table: dim_products, column: PRODUCT_ID } }
  - { name: SELLER_ID, type: VARCHAR, role: FOREIGN_KEY, description: Seller identifier., references: { table: dim_sellers, column: SELLER_ID } }
  - { name: SHIPPING_LIMIT_DATE_KEY, type: DATE, role: DATE, description: Seller shipping-limit date., references: { table: dim_date, column: DATE_DAY } }
  - { name: ORDER_ITEM_ID, type: NUMBER, role: DEGENERATE_DIMENSION, description: Item sequence number within the order (not unique alone). }
  - { name: ITEM_REVENUE, type: NUMBER, role: MEASURE, description: 'Merchandise revenue (ORDER_ITEMS.PRICE), excludes freight.' }
  - { name: FREIGHT_VALUE, type: NUMBER, role: MEASURE, description: Freight charged for the item. }

- id: fct_order_payments
  qualified_name: PULSAR_DB.GOLD.FCT_ORDER_PAYMENTS
  type: FACT
  business_name: Order payments
  description: >
    Payment fact at (order_id x payment_sequential) grain. PAYMENT_VALUE is the COLLECTED value
    including freight and adjustments — distinct from merchandise revenue.
  grain: One row per payment (order_id x payment_sequential).
  primary_key: [ ORDER_PAYMENT_KEY ]
  recommended_alias: fop
  warnings:
  - PAYMENT_VALUE is collected value (incl. freight/adjustments), NOT merchandise revenue. Do not present it as "revenue".
  - Multiple payment rows per order. Use COUNT(DISTINCT fop.ORDER_ID) to count orders.
  columns:
  - { name: ORDER_PAYMENT_KEY, type: VARCHAR, role: PRIMARY_KEY, description: Synthetic key for one payment row. }
  - { name: ORDER_ID, type: VARCHAR, role: FOREIGN_KEY, description: Order identifier., references: { table: fct_orders, column: ORDER_ID } }
  - { name: PAYMENT_SEQUENTIAL, type: NUMBER, role: DEGENERATE_DIMENSION, description: Payment sequence within the order. }
  - { name: PAYMENT_TYPE, type: VARCHAR, role: DIMENSION, description: 'Payment method (credit_card, boleto, voucher, debit_card).' }
  - { name: PAYMENT_INSTALLMENTS, type: NUMBER, role: MEASURE, description: Number of installments (bucket derivation in conventions). }
  - { name: PAYMENT_VALUE, type: NUMBER, role: MEASURE, description: Collected payment value (incl. freight/adjustments). }

- id: fct_order_reviews
  qualified_name: PULSAR_DB.GOLD.FCT_ORDER_REVIEWS
  type: FACT
  business_name: Order reviews
  description: >
    Review fact at (review_id, order_id) grain. Reviews are ORDER-level, not item-level. Delivery
    facts for the reviewed order are reached by joining FCT_ORDERS.
  grain: One row per review (review_id x order_id).
  primary_key: [ ORDER_REVIEW_KEY ]
  recommended_alias: fr
  warnings:
  - Reviews are at ORDER grain. To analyse review scores by product category, join BRIDGE_ORDER_CATEGORIES on ORDER_ID — this attributes each order's review to every category in the order; disclose that attribution.
  columns:
  - { name: ORDER_REVIEW_KEY, type: VARCHAR, role: PRIMARY_KEY, description: Synthetic key for one review/order row. }
  - { name: ORDER_ID, type: VARCHAR, role: FOREIGN_KEY, description: Order identifier., references: { table: fct_orders, column: ORDER_ID } }
  - { name: REVIEW_CREATION_DATE_KEY, type: DATE, role: DATE, description: Review creation date., references: { table: dim_date, column: DATE_DAY } }
  - { name: REVIEW_ANSWER_DATE_KEY, type: DATE, role: DATE, description: Review answer date (null if unanswered)., references: { table: dim_date, column: DATE_DAY } }
  - { name: REVIEW_ID, type: VARCHAR, role: DEGENERATE_DIMENSION, description: Review identifier. }
  - { name: REVIEW_COMMENT_TITLE, type: VARCHAR, role: DIMENSION, description: Free-text review title (often null). }
  - { name: REVIEW_COMMENT_MESSAGE, type: VARCHAR, role: DIMENSION, description: Free-text review message (often null). }
  - { name: REVIEW_SCORE, type: NUMBER, role: MEASURE, description: Review score from 1 to 5. Negative review = score <= 2. }

- id: dim_date
  qualified_name: PULSAR_DB.GOLD.DIM_DATE
  type: DIMENSION
  business_name: Calendar
  description: >
    Conformed date dimension (one row per calendar day), role-played by every *_DATE_KEY in the
    facts. Join it ONLY when a calendar attribute is needed; simple month/year grouping should use
    DATE_TRUNC/YEAR directly on the date key (see conventions). Alias it per role when joined more
    than once in a query.
  primary_key: [ DATE_DAY ]
  recommended_alias: dd
  columns:
  - { name: DATE_DAY, type: DATE, role: PRIMARY_KEY, description: Calendar day. }
  - { name: YEAR, type: NUMBER, role: DIMENSION, description: Calendar year. }
  - { name: QUARTER, type: NUMBER, role: DIMENSION, description: Quarter (1-4). }
  - { name: MONTH_NUMBER, type: NUMBER, role: DIMENSION, description: Month number (1-12). }
  - { name: MONTH_NAME, type: VARCHAR, role: DIMENSION, description: Month name. }
  - { name: MONTH_START_DATE, type: DATE, role: DIMENSION, description: First day of the month. }
  - { name: DAY_OF_MONTH, type: NUMBER, role: DIMENSION, description: Day of month (1-31). }
  - { name: DAY_OF_WEEK, type: NUMBER, role: DIMENSION, description: Day of week (0=Sunday .. 6=Saturday). }
  - { name: DAY_NAME, type: VARCHAR, role: DIMENSION, description: Day name. }
  - { name: WEEK_OF_YEAR, type: NUMBER, role: DIMENSION, description: Week of year. }
  - { name: IS_WEEKEND, type: BOOLEAN, role: FILTER, description: True for Saturday and Sunday. }

- id: dim_customers
  qualified_name: PULSAR_DB.GOLD.DIM_CUSTOMERS
  type: DIMENSION
  business_name: Customers
  description: >
    Conformed PHYSICAL customer dimension at CUSTOMER_UNIQUE_ID grain. Deliberately thin (Olist has
    no stable customer attribute; per-order geography lives on FCT_ORDERS). Anchor for
    distinct-customer counting and repeat-purchase analysis.
  primary_key: [ CUSTOMER_UNIQUE_ID ]
  recommended_alias: dc
  columns:
  - { name: CUSTOMER_UNIQUE_ID, type: VARCHAR, role: PRIMARY_KEY, description: Physical customer identifier. }

- id: dim_geography
  qualified_name: PULSAR_DB.GOLD.DIM_GEOGRAPHY
  type: DIMENSION
  business_name: Geography
  description: >
    Conformed geography at zip-code-prefix grain, ROLE-PLAYED as customer location (via
    FCT_ORDERS.CUSTOMER_ZIP_CODE_PREFIX) and seller location (via DIM_SELLERS.SELLER_ZIP_CODE_PREFIX).
    Alias it per role when both roles appear in one query (e.g. g_customer / g_seller).
  primary_key: [ ZIP_CODE_PREFIX ]
  recommended_alias: dg
  warnings:
  - Some zip prefixes have no geolocation source row; their CITY/STATE/coordinates are NULL.
  columns:
  - { name: ZIP_CODE_PREFIX, type: VARCHAR, role: PRIMARY_KEY, description: Brazilian zip-code prefix. }
  - { name: CITY, type: VARCHAR, role: DIMENSION, description: Representative city. }
  - { name: STATE, type: VARCHAR, role: DIMENSION, description: Brazilian state code., synonyms: [ uf ] }
  - { name: LATITUDE, type: NUMBER, role: DIMENSION, description: Zip-prefix centroid latitude. }
  - { name: LONGITUDE, type: NUMBER, role: DIMENSION, description: Zip-prefix centroid longitude. }
  - { name: GEOLOCATION_ROW_COUNT, type: NUMBER, role: DIMENSION, description: Source rows aggregated for this prefix (data-quality signal; 0 = no geolocation data). }

- id: dim_categories
  qualified_name: PULSAR_DB.GOLD.DIM_CATEGORIES
  type: DIMENSION
  business_name: Product categories
  description: >
    Conformed product-category dimension keyed on the Portuguese category name, with the English
    translation. Referenced by DIM_PRODUCTS and BRIDGE_ORDER_CATEGORIES.
  primary_key: [ PRODUCT_CATEGORY_NAME ]
  recommended_alias: dcat
  columns:
  - { name: PRODUCT_CATEGORY_NAME, type: VARCHAR, role: PRIMARY_KEY, description: Portuguese category name (canonical category key). }
  - { name: PRODUCT_CATEGORY_NAME_ENGLISH, type: VARCHAR, role: DIMENSION, description: English category name (null when untranslated) — preferred display name., synonyms: [ category ] }
  - { name: HAS_ENGLISH_CATEGORY, type: BOOLEAN, role: FILTER, description: True when an English translation exists. }

- id: dim_products
  qualified_name: PULSAR_DB.GOLD.DIM_PRODUCTS
  type: DIMENSION
  business_name: Products
  description: Product dimension with physical attributes. Category is snowflaked to DIM_CATEGORIES via PRODUCT_CATEGORY_NAME.
  primary_key: [ PRODUCT_ID ]
  recommended_alias: dp
  columns:
  - { name: PRODUCT_ID, type: VARCHAR, role: PRIMARY_KEY, description: Product identifier. }
  - { name: PRODUCT_CATEGORY_NAME, type: VARCHAR, role: FOREIGN_KEY, description: Portuguese category (may be null)., references: { table: dim_categories, column: PRODUCT_CATEGORY_NAME } }
  - { name: PRODUCT_NAME_LENGTH, type: NUMBER, role: DIMENSION, description: Length of the product name. }
  - { name: PRODUCT_DESCRIPTION_LENGTH, type: NUMBER, role: DIMENSION, description: Length of the product description. }
  - { name: PRODUCT_PHOTOS_QTY, type: NUMBER, role: MEASURE, description: Number of product photos. }
  - { name: PRODUCT_WEIGHT_G, type: NUMBER, role: MEASURE, description: Product weight in grams. }
  - { name: PRODUCT_LENGTH_CM, type: NUMBER, role: MEASURE, description: Product length in cm. }
  - { name: PRODUCT_HEIGHT_CM, type: NUMBER, role: MEASURE, description: Product height in cm. }
  - { name: PRODUCT_WIDTH_CM, type: NUMBER, role: MEASURE, description: Product width in cm. }

- id: dim_sellers
  qualified_name: PULSAR_DB.GOLD.DIM_SELLERS
  type: DIMENSION
  business_name: Sellers
  description: Seller dimension. Geography (city/state/coordinates) is reached via DIM_GEOGRAPHY on SELLER_ZIP_CODE_PREFIX (seller-location role).
  primary_key: [ SELLER_ID ]
  recommended_alias: ds
  columns:
  - { name: SELLER_ID, type: VARCHAR, role: PRIMARY_KEY, description: Seller identifier. }
  - { name: SELLER_ZIP_CODE_PREFIX, type: VARCHAR, role: FOREIGN_KEY, description: Seller zip prefix (seller-location role of geography)., references: { table: dim_geography, column: ZIP_CODE_PREFIX } }

- id: bridge_order_categories
  qualified_name: PULSAR_DB.GOLD.BRIDGE_ORDER_CATEGORIES
  type: BRIDGE
  business_name: Order-Category bridge
  description: >
    Keys-only bridge resolving the order/category many-to-many at (order_id x category) grain.
    Use it to slice ORDER-LEVEL facts (order counts, reviews) by category without item fan-out.
    It carries NO measures: category revenue comes from FCT_ORDER_ITEMS via product -> category.
  grain: One row per order_id x product_category_name.
  primary_key: [ ORDER_CATEGORY_KEY ]
  recommended_alias: boc
  warnings:
  - An order with N categories yields N bridge rows. Order-level counting through the bridge still needs COUNT(DISTINCT ORDER_ID).
  - To allocate an order-level measure across categories without double counting, multiply it by ALLOCATION_WEIGHT (weights of one order sum to 1) and disclose the allocation.
  columns:
  - { name: ORDER_CATEGORY_KEY, type: VARCHAR, role: PRIMARY_KEY, description: Synthetic key for one order/category membership row. }
  - { name: ORDER_ID, type: VARCHAR, role: FOREIGN_KEY, description: Order identifier., references: { table: fct_orders, column: ORDER_ID } }
  - { name: PRODUCT_CATEGORY_NAME, type: VARCHAR, role: FOREIGN_KEY, description: Portuguese category present in the order., references: { table: dim_categories, column: PRODUCT_CATEGORY_NAME } }
  - { name: ALLOCATION_WEIGHT, type: NUMBER, role: MEASURE, description: 1 / number of categories in the order — Kimball weighting factor for allocating order-level measures across categories. }

certified_metrics:
- id: total_merchandise_revenue
  name: Total merchandise revenue
  description: Sum of item-level merchandise revenue (excludes freight).
  base_table: fct_order_items
  expression_sql: SUM(foi.ITEM_REVENUE)
  additive_type: ADDITIVE
  synonyms: [ revenue, sales, gmv, turnover, net sales ]
  format: currency
  warnings:
  - Merchandise revenue, not collected payment value. Do not sum freight into it.
  - FCT_ORDER_ITEMS has no date column — time-based grouping requires joining FCT_ORDERS on ORDER_ID.

- id: total_payment_value
  name: Total collected payment value
  description: Sum of collected payment value (includes freight and adjustments).
  base_table: fct_order_payments
  expression_sql: SUM(fop.PAYMENT_VALUE)
  additive_type: ADDITIVE
  synonyms: [ collected value, payments, amount paid ]
  format: currency
  warnings:
  - Distinct from merchandise revenue. Use only when the question is about money collected / payments.

- id: total_freight
  name: Total freight
  description: Sum of freight charged.
  base_table: fct_order_items
  expression_sql: SUM(foi.FREIGHT_VALUE)
  additive_type: ADDITIVE
  synonyms: [ shipping cost, freight ]
  format: currency

- id: order_count
  name: Order count
  description: Number of distinct orders.
  base_table: fct_orders
  expression_sql: COUNT(DISTINCT fo.ORDER_ID)
  additive_type: NON_ADDITIVE
  synonyms: [ orders, number of orders, order volume ]
  format: integer
  warnings:
  - Always COUNT(DISTINCT ORDER_ID) — never COUNT(*) — when querying from a table with multiple rows per order (items, payments, bridge).

- id: unique_customer_count
  name: Distinct customers
  description: Number of distinct physical customers.
  base_table: fct_orders
  expression_sql: COUNT(DISTINCT fo.CUSTOMER_UNIQUE_ID)
  additive_type: NON_ADDITIVE
  synonyms: [ customers, distinct customers, buyers ]
  format: integer
  warnings:
  - Use CUSTOMER_UNIQUE_ID (physical customer), not CUSTOMER_ID (order-scoped).

- id: average_order_value
  name: Average order value
  description: Merchandise revenue divided by number of distinct orders.
  base_table: fct_order_items
  expression_sql: SUM(foi.ITEM_REVENUE) / NULLIF(COUNT(DISTINCT foi.ORDER_ID), 0)
  additive_type: NON_ADDITIVE
  synonyms: [ aov, average basket ]
  format: currency
  warnings:
  - Ratio of aggregates; never average a per-order value.

- id: average_review_score
  name: Average review score
  description: Mean review score (1-5).
  base_table: fct_order_reviews
  expression_sql: AVG(fr.REVIEW_SCORE)
  additive_type: NON_ADDITIVE
  synonyms: [ rating, satisfaction, csat ]
  format: decimal

- id: negative_review_rate
  name: Negative review rate
  description: Share of reviews with score <= 2.
  base_table: fct_order_reviews
  expression_sql: COUNT_IF(fr.REVIEW_SCORE <= 2) / NULLIF(COUNT(*), 0)
  additive_type: NON_ADDITIVE
  synonyms: [ bad review rate, dissatisfaction rate ]
  format: percentage
  warnings:
  - Ratio of aggregates, not an average of row-level flags.

- id: late_delivery_rate
  name: Late delivery rate
  description: Share of delivered orders that arrived after the estimated date (DELAY_DAYS > 0).
  base_table: fct_orders
  expression_sql: COUNT_IF(fo.DELAY_DAYS > 0) / NULLIF(COUNT_IF(fo.DELAY_DAYS IS NOT NULL), 0)
  additive_type: NON_ADDITIVE
  synonyms: [ late rate, delivery delay rate ]
  format: percentage
  warnings:
  - Denominator is delivered orders only (DELAY_DAYS IS NOT NULL). Ratio of aggregates.
  - Valid at FCT_ORDERS grain (one row per order). If computed through a finer table (items, bridge), switch to COUNT(DISTINCT CASE WHEN ... THEN fo.ORDER_ID END) on both sides.

sql_generation_rules:
- { id: no_select_star, severity: HIGH, rule: 'Never use SELECT *. Select only the columns needed.' }
- { id: use_certified_metrics, severity: HIGH, rule: 'Prefer certified metric expressions over ad-hoc aggregation of measure columns.' }
- { id: revenue_vs_payment, severity: HIGH, rule: 'Merchandise revenue (SUM ITEM_REVENUE on FCT_ORDER_ITEMS) is not payment value (SUM PAYMENT_VALUE on FCT_ORDER_PAYMENTS). Choose deliberately and state which.' }
- { id: distinct_orders, severity: HIGH, rule: 'When the queried table has multiple rows per order (items, payments, bridge), count orders with COUNT(DISTINCT ORDER_ID).' }
- { id: drill_across, severity: HIGH, rule: 'Joining a fine-grain fact to its order header FCT_ORDERS on ORDER_ID (many-to-one) is safe and often required. NEVER join two fine-grain facts (items, payments, reviews, bridge) directly to each other: to combine their measures, aggregate each to a common grain first, then join the aggregates (drill-across).' }
- { id: category_paths, severity: HIGH, rule: 'Merchandise revenue by category: FCT_ORDER_ITEMS -> DIM_PRODUCTS -> DIM_CATEGORIES, group by the category. Order-level facts (order counts, reviews) by category: through BRIDGE_ORDER_CATEGORIES on ORDER_ID with COUNT(DISTINCT ORDER_ID).' }
- { id: date_usage, severity: MEDIUM, rule: 'Simple time grouping (month, year): DATE_TRUNC/YEAR directly on the *_DATE_KEY column. Join DIM_DATE only for calendar attributes (day name, weekend, week), aliasing it per role if joined more than once.' }
- { id: ratio_of_aggregates, severity: HIGH, rule: 'Compute ratio metrics (rates, AOV) as ratios of aggregate expressions, not as averages of row-level ratios.' }
- { id: limit_detail_queries, severity: MEDIUM, rule: 'Add an explicit LIMIT to detail (non-aggregated) queries.' }

examples:
- question: What is total merchandise revenue by month?
  expected_tables: [ fct_order_items, fct_orders ]
  expected_metrics: [ total_merchandise_revenue ]
  notes: Items carry no date — the join to FCT_ORDERS is mandatory; month via DATE_TRUNC on the purchase date key (no DIM_DATE needed).
  sql: >
    SELECT DATE_TRUNC('month', fo.ORDER_PURCHASE_DATE_KEY) AS month,
      SUM(foi.ITEM_REVENUE) AS total_merchandise_revenue
    FROM PULSAR_DB.GOLD.FCT_ORDER_ITEMS foi
    JOIN PULSAR_DB.GOLD.FCT_ORDERS fo ON foi.ORDER_ID = fo.ORDER_ID
    GROUP BY 1 ORDER BY 1;
