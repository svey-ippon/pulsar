cubes:
  - name: helper_top_customer_state_categories
    public: false
    meta:
      summary: "Ranked product-category revenue within each customer state. Grain state x category."
    sql: >
      WITH category_state_revenue AS (
        SELECT
          c."CUSTOMER_STATE" AS customer_state,
          t."PRODUCT_CATEGORY_NAME_ENGLISH" AS category,
          SUM(oi."PRICE") AS revenue
        FROM ECOMMERCE_DB.MARTS.ORDER_ITEMS oi
        JOIN ECOMMERCE_DB.MARTS.ORDERS o
          ON oi."ORDER_ID" = o."ORDER_ID"
        JOIN ECOMMERCE_DB.MARTS.CUSTOMERS c
          ON o."CUSTOMER_ID" = c."CUSTOMER_ID"
        JOIN ECOMMERCE_DB.MARTS.PRODUCTS p
          ON oi."PRODUCT_ID" = p."PRODUCT_ID"
        JOIN ECOMMERCE_DB.MARTS.PRODUCT_CATEGORY_NAME_TRANSLATION t
          ON p."PRODUCT_CATEGORY_NAME" = t."PRODUCT_CATEGORY_NAME"
        WHERE o."ORDER_STATUS" = 'delivered'
          AND c."CUSTOMER_STATE" IS NOT NULL
          AND t."PRODUCT_CATEGORY_NAME_ENGLISH" IS NOT NULL
        GROUP BY c."CUSTOMER_STATE", t."PRODUCT_CATEGORY_NAME_ENGLISH"
      )
      SELECT
        CONCAT(customer_state, '::', category) AS state_category_key,
        customer_state,
        category AS product_category_name_english,
        revenue,
        ROW_NUMBER() OVER (
          PARTITION BY customer_state
          ORDER BY revenue DESC
        ) AS category_rank
      FROM category_state_revenue
    data_source: default
    description: >
      Ranked category revenue helper for "top categories within each customer state".
      Grain: one row per customer state and English category. Revenue is delivered
      merchandise revenue. Filter category_rank <= N to get top-N categories per state.

    joins: []

    dimensions:
      - name: state_category_key
        sql: "{CUBE}.\"STATE_CATEGORY_KEY\""
        type: string
        primary_key: true
        description: "Synthetic key for one customer-state/category revenue row."

      - name: customer_state
        sql: "{CUBE}.\"CUSTOMER_STATE\""
        type: string
        description: "Customer state code."

      - name: product_category_name_english
        sql: "{CUBE}.\"PRODUCT_CATEGORY_NAME_ENGLISH\""
        type: string
        description: "English product category name."

      - name: category_rank
        sql: "{CUBE}.\"CATEGORY_RANK\""
        type: number
        description: "Revenue rank of the category within its customer state; 1 is highest revenue."

    measures:
      - name: total_revenue
        sql: "{CUBE}.\"REVENUE\""
        type: sum
        description: "Delivered merchandise revenue for the customer-state/category pair."

    pre_aggregations: []
