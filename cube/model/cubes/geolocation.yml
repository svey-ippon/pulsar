cubes:
  - name: geolocation
    public: false
    meta:
      summary: "Brazilian zip code prefixes mapped to lat/lon, city, and state. Grain is zip prefix (5 digits)."
    sql_table: ECOMMERCE_DB.MARTS.GEOLOCATION
    data_source: default
    description: >
      Brazilian zip code coordinates. Maps five-digit zip prefixes to latitude,
      longitude, city, and state. Use to compute distances between sellers and
      customers or to plot geographic distributions on a map.

    joins: []

    dimensions:
      - name: geolocation_zip_code_prefix
        sql: "{CUBE}.\"GEOLOCATION_ZIP_CODE_PREFIX\""
        type: string
        description: "First five digits of a Brazilian zip code."

      - name: geolocation_city
        sql: "{CUBE}.\"GEOLOCATION_CITY\""
        type: string
        description: "City name for this zip prefix."

      - name: geolocation_state
        sql: "{CUBE}.\"GEOLOCATION_STATE\""
        type: string
        description: "Brazilian state (two-letter code) for this zip prefix."

    measures:
      - name: count
        type: count
        description: "Number of geolocation entries."

    pre_aggregations: []
