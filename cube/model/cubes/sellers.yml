cubes:
  - name: sellers
    sql_table: "\"RAW\".\"SELLERS\""
    data_source: default

    joins: []

    dimensions:
      - name: seller_city
        sql: "{CUBE}.\"SELLER_CITY\""
        type: string

      - name: seller_id
        sql: "{CUBE}.\"SELLER_ID\""
        type: string

      - name: seller_state
        sql: "{CUBE}.\"SELLER_STATE\""
        type: string

      - name: seller_zip_code_prefix
        sql: "{CUBE}.\"SELLER_ZIP_CODE_PREFIX\""
        type: string

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

