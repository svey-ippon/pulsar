cubes:
  - name: order_items
    sql_table: "\"RAW\".\"ORDER_ITEMS\""
    data_source: default

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

      - name: products
        sql: "{CUBE.product_id} = {products.product_id}"
        relationship: many_to_one

      - name: sellers
        sql: "{CUBE.seller_id} = {sellers.seller_id}"
        relationship: many_to_one

    dimensions:
      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: string

      - name: order_item_id
        sql: "{CUBE}.\"ORDER_ITEM_ID\""
        type: string

      - name: product_id
        sql: "{CUBE}.\"PRODUCT_ID\""
        type: string

      - name: seller_id
        sql: "{CUBE}.\"SELLER_ID\""
        type: string

      - name: shipping_limit_date
        sql: "{CUBE}.\"SHIPPING_LIMIT_DATE\""
        type: time

    measures:
      - name: count
        type: count

      - name: freight_value
        sql: "{CUBE}.\"FREIGHT_VALUE\""
        type: sum

      - name: price
        sql: "{CUBE}.\"PRICE\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

