cubes:
  - name: orders
    meta:
      summary: "Customer orders, one row per order; grain is order_id. Links to items, payments, reviews, and customers."
    sql_table: ECOMMERCE_DB.MARTS.ORDERS
    data_source: default
    description: >
      Grain: order_id — one row per order.
      Reachable from: customers (many_to_one join defined here).
      order_items, order_payments, and order_reviews each define their own join
      TO this cube. Cross-cube queries using orders.count with dimensions from
      those cubes work correctly — Cube deduplicates via COUNT(DISTINCT order_id).
      Use order_purchase_timestamp to analyse orders by when they were placed;
      use order_delivered_customer_date for delivery performance analysis.

    joins:
      - name: customers
        sql: "{CUBE.customer_id} = {customers.customer_id}"
        relationship: many_to_one

    dimensions:
      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: string
        primary_key: true
        description: "Unique order identifier."

      - name: customer_id
        sql: "{CUBE}.\"CUSTOMER_ID\""
        type: string
        description: "Foreign key to the customers cube. Each order has a distinct customer_id (not the stable customer_unique_id)."

      - name: order_status
        sql: "{CUBE}.\"ORDER_STATUS\""
        type: string
        description: "Current order status (delivered, shipped, processing, canceled, etc.)."

      - name: order_purchase_timestamp
        sql: "{CUBE}.\"ORDER_PURCHASE_TIMESTAMP\""
        type: time
        description: "Timestamp when the order was placed. Use this for revenue-over-time and order-volume analysis."

      - name: order_approved_at
        sql: "{CUBE}.\"ORDER_APPROVED_AT\""
        type: time
        description: "Timestamp when payment was approved."

      - name: order_delivered_carrier_date
        sql: "{CUBE}.\"ORDER_DELIVERED_CARRIER_DATE\""
        type: time
        description: "Timestamp when the order was handed to the logistics carrier."

      - name: order_delivered_customer_date
        sql: "{CUBE}.\"ORDER_DELIVERED_CUSTOMER_DATE\""
        type: time
        description: "Actual delivery date to the customer. Null if not yet delivered."

      - name: order_estimated_delivery_date
        sql: "{CUBE}.\"ORDER_ESTIMATED_DELIVERY_DATE\""
        type: time
        description: "Estimated delivery date shown to the customer at purchase time."

    measures:
      - name: count
        type: count
        description: "Number of distinct orders."

    pre_aggregations: []
