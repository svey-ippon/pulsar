cubes:
  - name: product_category_name_translation
    public: false
    meta:
      summary: "Lookup table: Portuguese product_category_name → English product_category_name_english."
    sql_table: ECOMMERCE_DB.MARTS.PRODUCT_CATEGORY_NAME_TRANSLATION
    data_source: default
    description: >
      Grain: product_category_name — one row per category (lookup table).
      Reachable only via: products → order_items chain.
      Not reachable from order_reviews — combining category dimensions with
      review measures requires a cross-grain join that does not exist in this
      semantic layer. See order_reviews description for details.

    joins: []

    dimensions:
      - name: product_category_name
        sql: "{CUBE}.\"PRODUCT_CATEGORY_NAME\""
        type: string
        primary_key: true
        description: "Category name in Portuguese (matches products.product_category_name)."

      - name: product_category_name_english
        sql: "{CUBE}.\"PRODUCT_CATEGORY_NAME_ENGLISH\""
        type: string
        description: "Category name translated to English."

    measures:
      - name: count
        type: count
        description: "Number of category translation entries."

    pre_aggregations: []
