cubes:
  - name: helper_customer_revenue_segments
    public: false
    meta:
      summary: "Revenue and customer share for repeat vs one-time customers. Grain customer segment."
    sql: >
      WITH customer_order_counts AS (
        SELECT
          c."CUSTOMER_UNIQUE_ID" AS customer_unique_id,
          COUNT(DISTINCT o."ORDER_ID") AS order_count,
          SUM(oi."PRICE") AS total_revenue
        FROM ECOMMERCE_DB.MARTS.CUSTOMERS c
        JOIN ECOMMERCE_DB.MARTS.ORDERS o
          ON c."CUSTOMER_ID" = o."CUSTOMER_ID"
        JOIN ECOMMERCE_DB.MARTS.ORDER_ITEMS oi
          ON o."ORDER_ID" = oi."ORDER_ID"
        WHERE o."ORDER_STATUS" = 'delivered'
          AND c."CUSTOMER_UNIQUE_ID" IS NOT NULL
        GROUP BY c."CUSTOMER_UNIQUE_ID"
      ),
      segmented AS (
        SELECT
          CASE WHEN order_count >= 2 THEN 'repeat' ELSE 'one_time' END AS customer_segment,
          COUNT(*) AS customers,
          SUM(total_revenue) AS revenue
        FROM customer_order_counts
        GROUP BY 1
      )
      SELECT
        customer_segment,
        customers,
        100.0 * customers / NULLIF(SUM(customers) OVER (), 0) AS pct_customers,
        revenue,
        100.0 * revenue / NULLIF(SUM(revenue) OVER (), 0) AS pct_revenue
      FROM segmented
    data_source: default
    description: >
      Customer revenue concentration model. Grain: one row per customer segment.
      Repeat customers are physical customers (customer_unique_id) with at least two
      delivered orders. Revenue is merchandise revenue from delivered orders.

    joins: []

    dimensions:
      - name: customer_segment
        sql: "{CUBE}.\"CUSTOMER_SEGMENT\""
        type: string
        primary_key: true
        description: "Customer segment: repeat for 2+ delivered orders, one_time otherwise."

    measures:
      - name: customer_count
        sql: "{CUBE}.\"CUSTOMERS\""
        type: sum
        description: "Number of physical customers in the segment."

      - name: pct_customers
        sql: "{CUBE}.\"PCT_CUSTOMERS\""
        type: max
        description: "Share of physical customers in this segment."

      - name: total_revenue
        sql: "{CUBE}.\"REVENUE\""
        type: sum
        description: "Delivered merchandise revenue generated by the segment."

      - name: pct_revenue
        sql: "{CUBE}.\"PCT_REVENUE\""
        type: max
        description: "Share of delivered merchandise revenue generated by the segment."

    pre_aggregations: []
