cubes:
  - name: order_reviews
    public: false
    meta:
      summary: "Post-delivery satisfaction surveys, one row per review. Provides avg_review_score (1-5) and review_count."
    sql_table: ECOMMERCE_DB.MARTS.ORDER_REVIEWS
    data_source: default
    description: >
      Grain: order_id — one row per review. A review covers the entire order,
      not individual items or product categories.
      Reachable from: orders (many_to_one join defined here).
      Cross-grain limitation: there is no join path from this cube to
      order_items, products, or product_category_name_translation. Combining
      avg_review_score or review_count with product-level dimensions (e.g.
      product category) is not feasible in a single query — it would require
      a cross-grain join that silently biases avg_review_score by the number
      of items per order in each category.
      Comments are written in Portuguese.

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

    dimensions:
      - name: review_id
        sql: "{CUBE}.\"REVIEW_ID\""
        type: string
        primary_key: true
        description: "Unique review identifier."

      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: string
        description: "Foreign key to the orders cube."

      - name: review_comment_title
        sql: "{CUBE}.\"REVIEW_COMMENT_TITLE\""
        type: string
        description: "Optional title left by the customer, in Portuguese."

      - name: review_comment_message
        sql: "{CUBE}.\"REVIEW_COMMENT_MESSAGE\""
        type: string
        description: "Optional free-text review message from the customer, in Portuguese."

      - name: review_creation_date
        sql: "{CUBE}.\"REVIEW_CREATION_DATE\""
        type: time
        description: "Date the satisfaction survey was sent to the customer."

      - name: review_answer_timestamp
        sql: "{CUBE}.\"REVIEW_ANSWER_TIMESTAMP\""
        type: time
        description: "Timestamp when the customer submitted their survey response."

      - name: review_score
        sql: "{CUBE}.\"REVIEW_SCORE\""
        type: number
        description: "Customer satisfaction rating from 1 (worst) to 5 (best)."

    measures:
      - name: review_count
        type: count
        description: "Number of reviews submitted."

      - name: avg_review_score
        sql: "{CUBE}.\"REVIEW_SCORE\""
        type: avg
        description: "Average customer satisfaction score (1–5). Use with order or seller dimensions to diagnose satisfaction patterns."

    pre_aggregations: []
