views:
  - name: adv_categories
    description: >
      Advanced SQL lookup view for product category translations.
      Grain: one row per product_category_name.
    meta:
      summary: "Advanced category translation table. Grain product_category_name."
      mode: advanced
      source_cube: product_category_name_translation
      sql_table: adv_categories
      grain: product_category
      primary_key:
        - product_category_name
      join_keys:
        - column: product_category_name
          joins_to: adv_products.product_category_name
          relationship: one_to_many
      ai_context: >
        Category lookup table. Use product_category_name_english for reporting
        category names in English.

    cubes:
      - join_path: product_category_name_translation
        includes:
          - product_category_name
          - product_category_name_english
          - count
