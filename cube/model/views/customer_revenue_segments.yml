views:
  - name: customer_revenue_segments
    description: >
      View for revenue concentration by customer segment.
      Grain: customer_segment. Repeat customers are physical customers
      (customer_unique_id) with at least two delivered orders. Revenue is delivered
      merchandise revenue. Use this for repeat vs one-time customer revenue share.
    meta:
      summary: "Customer segments: repeat vs one-time customer count and delivered revenue share."

    cubes:
      - join_path: helper_customer_revenue_segments
        includes:
          - customer_segment
          - customer_count
          - pct_customers
          - total_revenue
          - pct_revenue
