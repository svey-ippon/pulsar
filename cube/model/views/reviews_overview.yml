views:
  - name: reviews_overview
    description: >
      View focused on customer reviews. Grain: order_id (one review per order).
      Covers questions about the average review score and its correlation with
      delivery performance.
      ⚠️ Does NOT expose product category — grain mismatch (use advanced mode for that).
    meta:
      summary: "Customer reviews: average score, delivery correlation. Grain order_id."

    cubes:
      - join_path: order_reviews
        includes:
          - review_score
          - review_creation_date
          - review_count
          - avg_review_score

      - join_path: order_reviews.orders
        includes:
          - order_status
          - order_purchase_timestamp
          - delivery_status
          - delay_days

      - join_path: order_reviews.orders.customers
        includes:
          - customer_state
          - customer_city
