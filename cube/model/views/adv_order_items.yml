views:
  - name: adv_order_items
    description: >
      Advanced SQL view over order items. Grain: one row per order_item_key,
      equivalent to one row per order_id and order_item_id.
    meta:
      summary: "Advanced order items table. Grain order_id plus order_item_id."
      mode: advanced
      source_cube: order_items
      sql_table: adv_order_items
      grain: order_item
      primary_key:
        - order_item_key
      join_keys:
        - column: order_id
          joins_to: adv_orders.order_id
          relationship: many_to_one
        - column: product_id
          joins_to: adv_products.product_id
          relationship: many_to_one
        - column: seller_id
          joins_to: adv_sellers.seller_id
          relationship: many_to_one
      ai_context: >
        Item-grain table. Use total_revenue for merchandise revenue and
        freight_value for freight. Joining to order, review, or payment grain
        can create fan-out; aggregate deliberately.

    cubes:
      - join_path: order_items
        includes:
          - order_item_key
          - order_id
          - order_item_id
          - product_id
          - seller_id
          - shipping_limit_date
          - count
          - total_revenue
          - freight_value
          - price
          - average_price
