views:
  - name: adv_reviews
    description: >
      Advanced SQL view over order reviews. Grain: one row per review_id.
      Reviews are order-level satisfaction signals, not item-level signals.
    meta:
      summary: "Advanced reviews table. Grain review_id."
      mode: advanced
      source_cube: order_reviews
      sql_table: adv_reviews
      grain: review
      primary_key:
        - review_id
      join_keys:
        - column: order_id
          joins_to: adv_orders.order_id
          relationship: many_to_one
      ai_context: >
        Review table. review_score applies to the whole order. Do not average
        review_score after joining to item rows unless the SQL first defines an
        order-level attribution rule.

    cubes:
      - join_path: order_reviews
        includes:
          - review_id
          - order_id
          - review_comment_title
          - review_comment_message
          - review_creation_date
          - review_answer_timestamp
          - review_score
          - review_count
          - avg_review_score
