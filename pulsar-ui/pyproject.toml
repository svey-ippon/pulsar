[project]
name = "pulsar-ui"
version = "0.1.0"
description = "Streamlit UI for the Pulsar data-agent POC"
requires-python = "~=3.14.2"
dependencies = [
    "pulsar-agent",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.35",
]

[project.scripts]
pulsar-ui = "pulsar_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_ui"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
pulsar-agent = { workspace = true }
