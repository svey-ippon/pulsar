[project]
name = "pulsar-agent"
version = "0.1.0"
description = "LangGraph ReAct agent for natural-language analytics over a Cube semantic layer"
requires-python = "~=3.14.2"
dependencies = [
    "langchain>=1.3.1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "requests>=2.32",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_agent"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
