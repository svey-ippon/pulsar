version: 2

domain:
  id: fieldops
  name: FieldOps Service Analytics
  database: PULSAR_DB
  schema: FIELDOPS_GOLD
  owner: pulsar_poc
  description: >
    Certified gold-layer domain for FieldOps, an industrial field-maintenance company: technicians
    dispatched from depots service equipment at client sites under SLA. Modeled as a pure Kimball
    star: thin facts (work orders, billing lines, payments, satisfaction surveys) carrying only
    keys and measures, conformed dimensions (date, client, site, technician, geography, equipment
    category, part), and a keys-only weighted work-order/category bridge. Analytical attributes
    are reached through joins, not denormalized onto the facts.
  conventions:
  - 'Revenue is recognized at completion: time-scoped questions on revenue, billing lines or hours anchor on the work order''s COMPLETED_DATE_KEY. Billing lines carry NO date of their own — any time-scoped line analysis must join FCT_WORK_ORDERS.'
  - 'Dates: facts carry *_DATE_KEY columns of type DATE. For simple time grouping (month, year) apply DATE_TRUNC/YEAR directly on the date key. Join DIM_DATE only when a calendar attribute is needed (day name, weekend, week of year), aliasing it per role.'

tables:
- id: fct_work_orders
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.FCT_WORK_ORDERS
  type: FACT
  business_name: Work orders
  description: >
    Work-order fact at WORK_ORDER_ID grain (accumulating snapshot of the intervention lifecycle:
    opened -> promised -> scheduled -> started -> completed -> validated). Thin fact: keys,
    degenerate dimensions, header measures. Client, geography and calendar attributes are reached
    through DIM_SITES, DIM_TECHNICIANS and the date keys.
  primary_key: [ WORK_ORDER_ID ]
  default_date_column: COMPLETED_DATE_KEY
  recommended_alias: fwo
  columns:
  - name: WORK_ORDER_ID
    type: VARCHAR
    role: PRIMARY_KEY
    description: Unique work-order identifier (degenerate dimension shared by all work-order-grain facts).
  - name: SITE_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Client site where the intervention happens. Client company reached via DIM_SITES.CLIENT_ID.
    references: {table: dim_sites, column: SITE_ID}
  - name: TECHNICIAN_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Lead technician of the dispatched crew (see CREW_SIZE). Depot geography reached via DIM_TECHNICIANS.
    references: {table: dim_technicians, column: TECHNICIAN_ID}
  - name: OPENED_DATE_KEY
    type: DATE
    role: DATE
    description: Date the work order was opened (request received).
    references: {table: dim_date, column: DATE_DAY}
  - name: PROMISED_DATE_KEY
    type: DATE
    role: DATE
    description: Contractual SLA promise date — the anchor for lateness.
    references: {table: dim_date, column: DATE_DAY}
  - name: SCHEDULED_DATE_KEY
    type: DATE
    role: DATE
    description: Internally scheduled intervention date (planning, NOT the SLA anchor).
    references: {table: dim_date, column: DATE_DAY}
  - name: STARTED_DATE_KEY
    type: DATE
    role: DATE
    description: Date work started on site (null until started).
    references: {table: dim_date, column: DATE_DAY}
  - name: COMPLETED_DATE_KEY
    type: DATE
    role: DATE
    description: Date the work was completed (null = open work order). Default date for time analysis.
    references: {table: dim_date, column: DATE_DAY}
  - name: VALIDATED_DATE_KEY
    type: DATE
    role: DATE
    description: Date the client signed off the completed work (null until validated; lags completion).
    references: {table: dim_date, column: DATE_DAY}
  - name: WORK_ORDER_TYPE
    type: VARCHAR
    role: DIMENSION
    description: 'Intervention type: corrective | preventive | inspection.'
  - name: PRIORITY
    type: VARCHAR
    role: DIMENSION
    description: 'Priority: critical | high | standard.'
  - name: CREW_SIZE
    type: NUMBER
    role: DIMENSION
    description: Number of technicians dispatched (lead + assists). Explains why delivered man-hours exceed
      on-site elapsed time.
  - name: SLA_DELAY_BDAYS
    type: NUMBER
    role: MEASURE
    description: Signed BUSINESS days between the promised and completed dates (negative = early). "Late" =
      SLA_DELAY_BDAYS > 2 — business days, promised anchor, contractual 2-business-day grace; never
      calendar days, never the scheduled date. NULL = not completed, so delay and punctuality statistics
      cover COMPLETED work orders only (an open work order is neither late nor on time).
  - name: DURATION_HOURS
    type: NUMBER
    role: MEASURE
    description: On-site ELAPSED time of the intervention in hours (clock time from start to finish,
      independent of crew size). NULL = not completed. NOT the labor delivered — man-hours are
      BILLED_HOURS on the billing lines.
  - name: CALL_OUT_FEE
    type: NUMBER
    role: MEASURE
    description: Flat dispatch fee billed once per work order (HEADER grain). Never sum it through a
      row-level join to the billing lines (it would be replicated per line) — pre-aggregate the lines to
      work-order grain first.

- id: fct_work_order_lines
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.FCT_WORK_ORDER_LINES
  type: FACT
  business_name: Billing lines
  description: >
    Billing-line fact at (work_order_id x line_number) grain — the base table for billed amounts.
    Two kinds of lines (LINE_KIND): PART lines (a part used, with quantity) and LABOR lines
    (man-hours delivered). Thin fact: no site/client/date attributes — reached via FCT_WORK_ORDERS.
  grain: One row per billing line (work_order_id x line_number).
  primary_key: [ WORK_ORDER_LINE_KEY ]
  recommended_alias: fwol
  columns:
  - name: WORK_ORDER_LINE_KEY
    type: VARCHAR
    role: PRIMARY_KEY
    description: Synthetic key (work_order_id-line_number).
  - name: WORK_ORDER_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Work-order identifier.
    references: {table: fct_work_orders, column: WORK_ORDER_ID}
  - name: LINE_NUMBER
    type: NUMBER
    role: DEGENERATE_DIMENSION
    description: Line sequence within the work order (not unique alone).
  - name: LINE_KIND
    type: VARCHAR
    role: FILTER
    description: PART (a part used) or LABOR (man-hours delivered).
  - name: PART_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Part used (PART lines only; NULL on LABOR lines — means "no part", not "unknown").
      Part-level analyses must restrict to PART lines (LINE_KIND = 'PART').
    references: {table: dim_parts, column: PART_ID}
  - name: QUANTITY
    type: NUMBER
    role: MEASURE
    description: Quantity of the part used (PART lines only; NULL on LABOR lines).
  - name: BILLED_HOURS
    type: NUMBER
    role: MEASURE
    description: Man-hours DELIVERED and billed (LABOR lines only; NULL on PART lines). Sums across crew
      members — the measure of hours worked by technicians. Distinct from the header's elapsed DURATION_HOURS.
  - name: LINE_AMOUNT
    type: NUMBER
    role: MEASURE
    description: Billed amount of the line (parts or labor).

- id: fct_work_order_payments
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.FCT_WORK_ORDER_PAYMENTS
  type: FACT
  business_name: Payments
  description: >
    Payment fact at (work_order_id x payment_sequence) grain. PAYMENT_AMOUNT is COLLECTED cash
    settling the invoice (lines + call-out fee), with a collection lag and possible partial
    payments — distinct from service revenue both in timing and in amount.
  grain: One row per payment (work_order_id x payment_sequence).
  primary_key: [ WORK_ORDER_PAYMENT_KEY ]
  recommended_alias: fwp
  columns:
  - name: WORK_ORDER_PAYMENT_KEY
    type: VARCHAR
    role: PRIMARY_KEY
    description: Synthetic key for one payment row.
  - name: WORK_ORDER_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Work-order identifier.
    references: {table: fct_work_orders, column: WORK_ORDER_ID}
  - name: PAYMENT_SEQUENCE
    type: NUMBER
    role: DEGENERATE_DIMENSION
    description: Payment sequence within the work order (partial payments possible).
  - name: PAYMENT_METHOD
    type: VARCHAR
    role: DIMENSION
    description: 'Payment method: bank_transfer | corporate_card | purchase_order.'
  - name: PAID_DATE_KEY
    type: DATE
    role: DATE
    description: Date the payment was received (lags completion).
    references: {table: dim_date, column: DATE_DAY}
  - name: PAYMENT_AMOUNT
    type: NUMBER
    role: MEASURE
    description: Collected payment amount (cash in, not revenue).

- id: fct_satisfaction_surveys
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.FCT_SATISFACTION_SURVEYS
  type: FACT
  business_name: Satisfaction surveys
  description: >
    Satisfaction-survey fact at survey RESPONSE grain: several responses per work order are
    possible (clients may be re-surveyed). Satisfaction statistics use the LATEST response per
    work order (highest RESPONSE_SEQUENCE) — averaging all rows over-weights re-surveyed work
    orders.
  grain: One row per survey response (work_order_id x response_sequence).
  primary_key: [ SURVEY_RESPONSE_KEY ]
  recommended_alias: fss
  columns:
  - name: SURVEY_RESPONSE_KEY
    type: VARCHAR
    role: PRIMARY_KEY
    description: Synthetic key for one survey response.
  - name: WORK_ORDER_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Work-order identifier.
    references: {table: fct_work_orders, column: WORK_ORDER_ID}
  - name: RESPONSE_SEQUENCE
    type: NUMBER
    role: DEGENERATE_DIMENSION
    description: Response sequence within the work order; the highest sequence is the latest (the one that
      counts).
  - name: RESPONDED_DATE_KEY
    type: DATE
    role: DATE
    description: Date the survey response was received.
    references: {table: dim_date, column: DATE_DAY}
  - name: SATISFACTION_SCORE
    type: NUMBER
    role: MEASURE
    description: Satisfaction score from 1 to 10.

- id: dim_date
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_DATE
  type: DIMENSION
  business_name: Calendar
  description: >
    Conformed date dimension (one row per calendar day), role-played by every *_DATE_KEY in the
    facts (six work-order milestones, payment date, survey date). Join it ONLY when a calendar
    attribute is needed; simple month/year grouping should use DATE_TRUNC/YEAR directly on the
    date key (see conventions). Alias it per role when joined more than once in a query.
  primary_key: [ DATE_DAY ]
  recommended_alias: dd
  columns:
  - name: DATE_DAY
    type: DATE
    role: PRIMARY_KEY
    description: Calendar day.
  - name: YEAR
    type: NUMBER
    role: DIMENSION
    description: Calendar year.
  - name: QUARTER
    type: NUMBER
    role: DIMENSION
    description: Quarter (1-4).
  - name: MONTH_NUMBER
    type: NUMBER
    role: DIMENSION
    description: Month number (1-12).
  - name: MONTH_NAME
    type: VARCHAR
    role: DIMENSION
    description: Month name.
  - name: MONTH_START_DATE
    type: DATE
    role: DIMENSION
    description: First day of the month.
  - name: DAY_OF_MONTH
    type: NUMBER
    role: DIMENSION
    description: Day of month (1-31).
  - name: DAY_OF_WEEK
    type: NUMBER
    role: DIMENSION
    description: Day of week (0=Sunday .. 6=Saturday).
  - name: DAY_NAME
    type: VARCHAR
    role: DIMENSION
    description: Day name.
  - name: WEEK_OF_YEAR
    type: NUMBER
    role: DIMENSION
    description: Week of year.
  - name: IS_WEEKEND
    type: BOOLEAN
    role: FILTER
    description: True for Saturday and Sunday (business days are Mon-Fri).

- id: dim_clients
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_CLIENTS
  type: DIMENSION
  business_name: Clients
  description: >
    Conformed client dimension: the contract-holding client COMPANY — the "customer" of FieldOps.
    Counting customers = COUNT(DISTINCT CLIENT_ID); a site is a service location, never a
    customer. A client operates several sites; the facts reference the SITE, so client-level
    analysis goes FCT_* -> DIM_SITES -> DIM_CLIENTS (snowflake).
  primary_key: [ CLIENT_ID ]
  recommended_alias: dcl
  columns:
  - name: CLIENT_ID
    type: VARCHAR
    role: PRIMARY_KEY
    description: Client company identifier.
  - name: CLIENT_NAME
    type: VARCHAR
    role: DIMENSION
    description: Client company name.
  - name: INDUSTRY
    type: VARCHAR
    role: DIMENSION
    description: Client industry (manufacturing, food_processing, logistics, ...).
  - name: CONTRACT_TIER
    type: VARCHAR
    role: DIMENSION
    description: 'Service contract tier: standard | premium | enterprise.'

- id: dim_sites
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_SITES
  type: DIMENSION
  business_name: Client sites
  description: >
    Client LOCATIONS where interventions happen (a client company operates several sites; the
    owning company is reached via CLIENT_ID). Geography reached via DIM_GEOGRAPHY on
    SITE_ZIP_CODE_PREFIX (site-location role).
  primary_key: [ SITE_ID ]
  recommended_alias: dst
  columns:
  - name: SITE_ID
    type: VARCHAR
    role: PRIMARY_KEY
    description: Site identifier.
  - name: CLIENT_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Owning client company.
    references: {table: dim_clients, column: CLIENT_ID}
  - name: SITE_NAME
    type: VARCHAR
    role: DIMENSION
    description: Site name.
  - name: SITE_TYPE
    type: VARCHAR
    role: DIMENSION
    description: 'Site type: plant | warehouse | office.'
  - name: SITE_ZIP_CODE_PREFIX
    type: VARCHAR
    role: FOREIGN_KEY
    description: Site zip prefix (site-location role of geography).
    references: {table: dim_geography, column: ZIP_CODE_PREFIX}

- id: dim_technicians
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_TECHNICIANS
  type: DIMENSION
  business_name: Technicians
  description: >
    Lead-technician dimension (the dispatched crew lead; crew size is on the work order). Each
    technician is attached to a dispatch DEPOT; depot geography is reached via DIM_GEOGRAPHY on
    DEPOT_ZIP_CODE_PREFIX (depot-location role — distinct from the site-location role).
  primary_key: [ TECHNICIAN_ID ]
  recommended_alias: dtech
  columns:
  - name: TECHNICIAN_ID
    type: VARCHAR
    role: PRIMARY_KEY
    description: Technician identifier.
  - name: DEPOT_CODE
    type: VARCHAR
    role: DIMENSION
    description: Dispatch depot code.
  - name: DEPOT_ZIP_CODE_PREFIX
    type: VARCHAR
    role: FOREIGN_KEY
    description: Depot zip prefix (depot-location role of geography).
    references: {table: dim_geography, column: ZIP_CODE_PREFIX}
  - name: SENIORITY_LEVEL
    type: VARCHAR
    role: DIMENSION
    description: junior | senior | expert.

- id: dim_geography
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_GEOGRAPHY
  type: DIMENSION
  business_name: Geography
  description: >
    Conformed geography at zip-code-prefix grain, ROLE-PLAYED as site location (via
    DIM_SITES.SITE_ZIP_CODE_PREFIX) and depot location (via DIM_TECHNICIANS.DEPOT_ZIP_CODE_PREFIX).
    Sites and depots are often in different states — choose the role the question asks about, and
    alias per role when both appear in one query (e.g. g_site / g_depot).
  primary_key: [ ZIP_CODE_PREFIX ]
  recommended_alias: dg
  columns:
  - name: ZIP_CODE_PREFIX
    type: VARCHAR
    role: PRIMARY_KEY
    description: Zip-code prefix.
  - name: CITY
    type: VARCHAR
    role: DIMENSION
    description: City.
  - name: STATE
    type: VARCHAR
    role: DIMENSION
    description: State.

- id: dim_equipment_categories
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_EQUIPMENT_CATEGORIES
  type: DIMENSION
  business_name: Equipment categories
  description: >
    Equipment-category referential (compressor, hvac, conveyor, pump, ...). Individual equipment
    UNITS are not part of this model — work orders reach categories only through
    BRIDGE_WORK_ORDER_CATEGORIES; there is no work-order/equipment-unit linkage in the gold layer.
  primary_key: [ EQUIPMENT_CATEGORY ]
  recommended_alias: deqc
  columns:
  - name: EQUIPMENT_CATEGORY
    type: VARCHAR
    role: PRIMARY_KEY
    description: Equipment category (natural key).
  - name: CATEGORY_GROUP
    type: VARCHAR
    role: DIMENSION
    description: rotating | static | electrical | climate.

- id: dim_parts
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.DIM_PARTS
  type: DIMENSION
  business_name: Parts
  description: Spare-parts catalogue, referenced by PART billing lines (LABOR lines carry no part).
  primary_key: [ PART_ID ]
  recommended_alias: dpt
  columns:
  - name: PART_ID
    type: VARCHAR
    role: PRIMARY_KEY
    description: Part identifier.
  - name: PART_NAME
    type: VARCHAR
    role: DIMENSION
    description: Part name.
  - name: PART_FAMILY
    type: VARCHAR
    role: DIMENSION
    description: Part family (filter, bearing, valve, belt, sensor, ...).

- id: bridge_work_order_categories
  qualified_name: PULSAR_DB.FIELDOPS_GOLD.BRIDGE_WORK_ORDER_CATEGORIES
  type: BRIDGE
  business_name: Work-order / category bridge
  description: >
    Keys-only weighted bridge resolving the work-order/equipment-category many-to-many at
    (work_order_id x equipment_category) grain — a work order can service equipment of several
    categories. It carries NO measures of its own; ALLOCATION_WEIGHT is the Kimball weighting
    factor for allocating work-order-level measures across categories.
  grain: One row per work_order_id x equipment_category.
  primary_key: [ WORK_ORDER_ID, EQUIPMENT_CATEGORY ]
  recommended_alias: bwc
  warnings:
  - Allocating a work-order-level MEASURE (revenue, fees, hours) across categories REQUIRES multiplying by ALLOCATION_WEIGHT — an unweighted join double-counts multi-category work orders; disclose the allocation. Pure work-order COUNTS need no weight — a work order legitimately counts once in each of its categories.
  columns:
  - name: WORK_ORDER_ID
    type: VARCHAR
    role: FOREIGN_KEY
    description: Work-order identifier.
    references: {table: fct_work_orders, column: WORK_ORDER_ID}
  - name: EQUIPMENT_CATEGORY
    type: VARCHAR
    role: FOREIGN_KEY
    description: Equipment category serviced by the work order.
    references: {table: dim_equipment_categories, column: EQUIPMENT_CATEGORY}
  - name: ALLOCATION_WEIGHT
    type: NUMBER
    role: MEASURE
    description: 1 / number of categories in the work order (the weights of one work order sum to 1).

certified_metrics:
- id: total_service_revenue
  name: Total service revenue
  description: >
    All-in service revenue: billed line amounts PLUS the work-order call-out fees. FieldOps
    prices interventions all-in — the call-out fee is part of revenue, never excluded.
  base_table: fct_work_orders
  expression_sql: SUM(fwo.CALL_OUT_FEE + COALESCE(lr.WO_LINE_AMOUNT, 0))
  additive_type: ADDITIVE
  format: currency
  warnings:
  - lr is FCT_WORK_ORDER_LINES PRE-AGGREGATED to work-order grain — 'lr AS (SELECT WORK_ORDER_ID, SUM(LINE_AMOUNT) AS WO_LINE_AMOUNT FROM ... GROUP BY WORK_ORDER_ID)' joined to FCT_WORK_ORDERS on WORK_ORDER_ID.
  - Service revenue is NOT collected payment value (FCT_WORK_ORDER_PAYMENTS) — different timing, possibly different amount.

- id: total_collected_amount
  name: Total collected cash
  description: Sum of payments received (settles invoices with a lag; partial payments possible).
  base_table: fct_work_order_payments
  expression_sql: SUM(fwp.PAYMENT_AMOUNT)
  additive_type: ADDITIVE
  format: currency
  warnings:
  - Distinct from service revenue. Use only when the question is about money collected / payments.

- id: work_order_count
  name: Work-order count
  description: Number of distinct work orders.
  base_table: fct_work_orders
  expression_sql: COUNT(DISTINCT fwo.WORK_ORDER_ID)
  additive_type: NON_ADDITIVE
  format: integer

- id: client_count
  name: Distinct clients
  description: Number of distinct client companies (the "customers" of FieldOps).
  base_table: dim_clients
  expression_sql: COUNT(DISTINCT dcl.CLIENT_ID)
  additive_type: NON_ADDITIVE
  format: integer

- id: total_billed_hours
  name: Total billed hours
  description: Man-hours delivered and billed by technicians (sum of LABOR-line hours; sums across crew members).
  base_table: fct_work_order_lines
  expression_sql: SUM(fwol.BILLED_HOURS)
  additive_type: ADDITIVE
  synonyms: [ site hours ]
  format: decimal

- id: average_intervention_duration
  name: Average on-site duration
  description: Average ELAPSED on-site time of completed interventions, in hours (clock time, independent of crew size).
  base_table: fct_work_orders
  expression_sql: AVG(fwo.DURATION_HOURS)
  additive_type: NON_ADDITIVE
  format: decimal

- id: late_completion_rate
  name: Late completion rate
  description: Share of COMPLETED work orders finished late (more than 2 business days after the promised date).
  base_table: fct_work_orders
  expression_sql: COUNT_IF(fwo.SLA_DELAY_BDAYS > 2) / NULLIF(COUNT_IF(fwo.SLA_DELAY_BDAYS IS NOT NULL), 0)
  additive_type: NON_ADDITIVE
  format: percentage

- id: on_time_completion_rate
  name: On-time completion rate
  description: Share of COMPLETED work orders finished within the SLA (within 2 business days of the promised date).
  base_table: fct_work_orders
  expression_sql: COUNT_IF(fwo.SLA_DELAY_BDAYS <= 2) / NULLIF(COUNT_IF(fwo.SLA_DELAY_BDAYS IS NOT NULL), 0)
  additive_type: NON_ADDITIVE
  format: percentage

- id: average_sla_delay
  name: Average SLA delay (business days)
  description: Mean signed business-day delay vs the promised date, among completed work orders (negative = early on average).
  base_table: fct_work_orders
  expression_sql: AVG(fwo.SLA_DELAY_BDAYS)
  additive_type: NON_ADDITIVE
  format: decimal

- id: average_satisfaction_score
  name: Average satisfaction score
  description: Mean satisfaction score (1-10) over the LATEST survey response of each surveyed work order.
  base_table: fct_satisfaction_surveys
  expression_sql: AVG(fss.SATISFACTION_SCORE) -- over the latest response per work order only (see warnings)
  additive_type: NON_ADDITIVE
  format: decimal
  warnings:
  - Restrict to the latest response per work order first — 'QUALIFY ROW_NUMBER() OVER (PARTITION BY WORK_ORDER_ID ORDER BY RESPONSE_SEQUENCE DESC) = 1' — then average. A plain AVG over all rows over-weights re-surveyed work orders.
