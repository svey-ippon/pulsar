[project]
name = "pulsar-bare-agent"
version = "0.1.0"
description = "LangGraph agent that generates raw SQL against a governed Snowflake gold layer using a YAML semantic contract"
requires-python = "~=3.14.2"
dependencies = [
    "langchain>=1.3.1",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "snowflake-connector-python>=3.12",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_bare_agent"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
