[project]
name = "pulsar-bare-api"
version = "0.1.0"
description = "FastAPI service exposing the bare SQL agent: conversation threads, history, SSE streaming"
requires-python = "~=3.14.2"
dependencies = [
    "pulsar-bare-agent",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
pulsar-bare-api = "pulsar_bare_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_bare_api"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
