views:
  - name: seller_delivery_performance
    description: >
      View for seller delivery performance by seller geography.
      Grain: seller/order item for delivered orders with known delivery dates.
      Positive delay_days means the delivery arrived after the promised date.
      Use this for worst seller states by average delivery delay and late-delivery rate.
    meta:
      summary: "Seller delivery performance: delay, late rate, and delivery count by seller geography."

    cubes:
      - join_path: helper_seller_delivery_performance
        includes:
          - seller_id
          - seller_state
          - seller_city
          - delay_days
          - delivery_late_status
          - delivery_count
          - avg_delay_days
          - late_delivery_count
          - pct_late
