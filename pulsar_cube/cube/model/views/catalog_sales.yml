views:
  - name: catalog_sales
    description: >
      View focused on sales at item grain: revenue, categories, sellers.
      Grain: (order_id, order_item_id).
      Covers questions about top categories, best sellers, and revenue by product.
    meta:
      summary: "Sales by item: revenue, English categories, sellers. Grain (order_id, order_item_id)."

    cubes:
      - join_path: order_items
        includes:
          - count
          - total_revenue
          - freight_value
          - seller_count
          - revenue_per_seller

      - join_path: order_items.orders
        includes:
          - order_purchase_timestamp
          - order_status

      - join_path: order_items.products
        includes:
          - product_id

      - join_path: order_items.products.product_category_name_translation
        includes:
          - product_category_name_english

      - join_path: order_items.sellers
        prefix: true
        includes:
          - seller_id
          - seller_state
          - seller_city
