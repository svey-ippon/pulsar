cubes:
  - name: orders
    public: false
    meta:
      summary: "Customer orders, one row per order; grain is order_id. Links to items, payments, reviews, and customers."
    sql_table: ECOMMERCE_DB.SILVER.ORDERS
    data_source: default
    description: >
      Grain: order_id — one row per order.
      Reachable from: customers (many_to_one join defined here).
      order_items, order_payments, and order_reviews each define their own join
      TO this cube. Cross-cube queries using orders.count with dimensions from
      those cubes work correctly — Cube deduplicates via COUNT(DISTINCT order_id).
      Use order_purchase_timestamp to analyse orders by when they were placed;
      use order_delivered_customer_date for delivery performance analysis.

    joins:
      - name: customers
        sql: "{CUBE.customer_id} = {customers.customer_id}"
        relationship: many_to_one

      - name: order_items
        sql: "{CUBE}.\"ORDER_ID\" = {order_items.order_id}"
        relationship: one_to_many

      - name: order_reviews
        sql: "{CUBE}.\"ORDER_ID\" = {order_reviews.order_id}"
        relationship: one_to_many

      - name: order_payments
        sql: "{CUBE}.\"ORDER_ID\" = {order_payments.order_id}"
        relationship: one_to_many

    dimensions:
      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: string
        primary_key: true
        description: "Unique order identifier."

      - name: customer_id
        sql: "{CUBE}.\"CUSTOMER_ID\""
        type: string
        description: "Foreign key to the customers cube. Each order has a distinct customer_id (not the stable customer_unique_id)."

      - name: order_status
        sql: "{CUBE}.\"ORDER_STATUS\""
        type: string
        description: "Current order status (delivered, shipped, processing, canceled, etc.)."

      - name: order_purchase_timestamp
        sql: "{CUBE}.\"ORDER_PURCHASE_TIMESTAMP\""
        type: time
        description: "Timestamp when the order was placed. Use this for revenue-over-time and order-volume analysis."

      - name: order_approved_at
        sql: "{CUBE}.\"ORDER_APPROVED_AT\""
        type: time
        description: "Timestamp when payment was approved."

      - name: order_delivered_carrier_date
        sql: "{CUBE}.\"ORDER_DELIVERED_CARRIER_DATE\""
        type: time
        description: "Timestamp when the order was handed to the logistics carrier."

      - name: order_delivered_customer_date
        sql: "{CUBE}.\"ORDER_DELIVERED_CUSTOMER_DATE\""
        type: time
        description: "Actual delivery date to the customer. Null if not yet delivered."

      - name: order_estimated_delivery_date
        sql: "{CUBE}.\"ORDER_ESTIMATED_DELIVERY_DATE\""
        type: time
        description: "Estimated delivery date shown to the customer at purchase time."

      - name: delay_days
        sql: >
          DATEDIFF('day',
            {CUBE}."ORDER_ESTIMATED_DELIVERY_DATE",
            {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE"
          )
        type: number
        description: >
          Delivery delay in days (positive = late, negative = early).
          NULL if the order has not been delivered yet.

      - name: delivery_status
        sql: >
          CASE
            WHEN {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE" IS NULL THEN 'not_delivered'
            WHEN {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE"
                 <= {CUBE}."ORDER_ESTIMATED_DELIVERY_DATE" THEN 'on_time'
            WHEN {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE"
                 <= DATEADD('day', 7, {CUBE}."ORDER_ESTIMATED_DELIVERY_DATE") THEN 'late'
            ELSE 'very_late'
          END
        type: string
        description: >
          Calculated delivery status: 'on_time' (delivered on time or early),
          'late' (up to 7 days late), 'very_late' (more than 7 days late),
          'not_delivered' (not yet delivered). Use for Q16 (satisfaction vs delivery).

      - name: delivery_late_status
        sql: >
          CASE
            WHEN {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE" IS NULL THEN 'not_delivered'
            WHEN {CUBE}."ORDER_DELIVERED_CUSTOMER_DATE"
                 > {CUBE}."ORDER_ESTIMATED_DELIVERY_DATE" THEN 'late'
            ELSE 'on_time'
          END
        type: string
        description: >
          Binary delivery status for satisfaction comparisons: 'late' if delivered
          after the promised date, 'on_time' otherwise, and 'not_delivered' when
          there is no delivered customer date.

      - name: is_delivered
        sql: "({CUBE}.\"ORDER_DELIVERED_CUSTOMER_DATE\" IS NOT NULL)"
        type: boolean
        description: "True if the order has been delivered to the customer."

    measures:
      - name: count
        type: count
        description: "Number of distinct orders."

      - name: avg_delay_days
        sql: "{delay_days}"
        type: avg
        description: >
          Average delivery delay in days (positive = average late).
          ⚠️ Non-additive — do not sum across states or categories.

      - name: delivered_count
        sql: "{CUBE}.\"ORDER_ID\""
        type: count
        filters:
          - sql: "{CUBE}.\"ORDER_DELIVERED_CUSTOMER_DATE\" IS NOT NULL"
        description: "Number of orders that have been delivered to the customer."

    pre_aggregations: []
