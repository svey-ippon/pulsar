cubes:
  - name: order_items
    public: false
    meta:
      summary: "Line items within orders, one row per (order, item) pair. Tracks merchandise price and freight per item."
    sql_table: ECOMMERCE_DB.SILVER.ORDER_ITEMS
    data_source: default
    description: >
      Grain: (order_id, order_item_id) — one row per item within an order.
      An order can contain multiple items of the same product; freight is split
      proportionally across items. Sum freight_value across items to get
      order-level freight.
      Reachable from: orders, products, sellers (many_to_one joins defined here).
      Cross-grain note: combining measures from this cube with order_reviews
      dimensions in a single query creates a one-to-many fan-out (one review
      per order × N items per order) that silently biases any aggregation.

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

      - name: products
        sql: "{CUBE.product_id} = {products.product_id}"
        relationship: many_to_one

      - name: sellers
        sql: "{CUBE.seller_id} = {sellers.seller_id}"
        relationship: many_to_one

    dimensions:
      - name: order_item_key
        sql: "CONCAT({CUBE}.\"ORDER_ID\", '-', {CUBE}.\"ORDER_ITEM_ID\")"
        type: string
        primary_key: true

      - name: order_id
        sql: "{CUBE}.\"ORDER_ID\""
        type: string
        description: "Foreign key to the orders cube."

      - name: order_item_id
        sql: "{CUBE}.\"ORDER_ITEM_ID\""
        type: string
        description: "Sequential position of this item within the order (1, 2, 3…)."

      - name: product_id
        sql: "{CUBE}.\"PRODUCT_ID\""
        type: string
        description: "Foreign key to the products cube."

      - name: seller_id
        sql: "{CUBE}.\"SELLER_ID\""
        type: string
        description: "Foreign key to the sellers cube — identifies which seller fulfilled this item."

      - name: shipping_limit_date
        sql: "{CUBE}.\"SHIPPING_LIMIT_DATE\""
        type: time
        description: "Deadline by which the seller must hand the item to the logistics partner."

    measures:
      - name: count
        type: count
        description: "Number of order line items."

      - name: total_revenue
        sql: "{CUBE}.\"PRICE\""
        type: sum
        description: "Merchandise revenue: sum of item price, excluding freight and payment adjustments."

      - name: freight_value
        sql: "{CUBE}.\"FREIGHT_VALUE\""
        type: sum
        description: "Total freight cost. Each item carries a prorated share; sum across items for order-level freight."

      - name: price
        sql: "{CUBE}.\"PRICE\""
        type: sum
        description: "Alias for total_revenue — sum of item prices. Prefer total_revenue for revenue reporting."

      - name: average_price
        sql: "{CUBE}.\"PRICE\""
        type: avg
        description: "Average item price (merchandise only, excluding freight)."

      - name: seller_count
        sql: "{CUBE}.\"SELLER_ID\""
        type: count_distinct
        description: "Number of distinct sellers represented in the current result grain."

      - name: revenue_per_seller
        sql: "{total_revenue} / NULLIF({seller_count}, 0)"
        type: number
        description: "Merchandise revenue divided by distinct seller count for the current grouping."

    pre_aggregations: []
