# Iso-content twin of the pulsar_bare semantic contract v2 (see SEMANTIC_PARITY_MAPPING.md).
# Built on the pure-Kimball gold star: 4 thin facts, conformed dimensions, keys-only bridge.
# Scope: the 11 star tables only (DIM_DATE intentionally NOT modeled — date keys are exposed as
# time_dimensions, the idiomatic equivalent of the pulsar date convention; DIM_GEOGRAPHY is
# role-played as two logical tables).
name: OLIST_ANALYTICS
description: "Semantic view for Olist e-commerce analytics on the governed Gold star schema (PULSAR_DB.GOLD). Facts are thin (keys + measures); analytical attributes are reached through relationships. Iso-content with the pulsar_bare semantic contract v2."

tables:

  # ─── FACTS ──────────────────────────────────────────────────────────────────

  - name: orders
    description: "Order fact at order_id grain (accumulating snapshot of the order lifecycle). One order can have many items, payments and (rarely) reviews: when combined with those, count orders with COUNT(DISTINCT order_id). Delivery status is derived from delay_days."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: FCT_ORDERS
    primary_key:
      columns: [ORDER_ID]
    dimensions:
      - name: order_id
        description: "Unique order identifier (shared by all order-grain facts)."
        expr: order_id
        data_type: VARCHAR
        unique: true
      - name: customer_id
        description: "Order-scoped customer key (one per order). Use customer_unique_id for physical customers."
        expr: customer_id
        data_type: VARCHAR
      - name: customer_unique_id
        description: "Physical customer identity across multiple orders."
        expr: customer_unique_id
        data_type: VARCHAR
      - name: customer_zip_code_prefix
        description: "Customer zip prefix for this order (customer-location role of geography)."
        expr: customer_zip_code_prefix
        data_type: VARCHAR
      - name: order_status
        synonyms: ["status"]
        description: "Operational status of the order."
        expr: order_status
        data_type: VARCHAR
        is_enum: true
        sample_values: ["delivered", "shipped", "canceled", "invoiced", "processing", "unavailable", "created", "approved"]
      - name: delivery_status
        description: "Delivery status DERIVED from delay_days: not_delivered (null), on_time (<= 0), late (1..7), very_late (> 7). A 'late delivery' is delay_days > 0."
        expr: "CASE WHEN delay_days IS NULL THEN 'not_delivered' WHEN delay_days <= 0 THEN 'on_time' WHEN delay_days <= 7 THEN 'late' ELSE 'very_late' END"
        data_type: VARCHAR
        is_enum: true
        sample_values: ["on_time", "late", "very_late", "not_delivered"]
      - name: delivered_orders_only
        description: "Filter for delivered orders (delay_days is not null)."
        expr: "delay_days IS NOT NULL"
        data_type: BOOLEAN
        labels: [filter]
      - name: late_deliveries_only
        description: "Filter for orders delivered after the estimated date (delay_days > 0)."
        expr: "delay_days > 0"
        data_type: BOOLEAN
        labels: [filter]
    time_dimensions:
      - name: order_purchase_date_key
        synonyms: ["purchase date", "order date"]
        description: "Purchase date (default date for time analysis)."
        expr: order_purchase_date_key
        data_type: DATE
      - name: order_approved_date_key
        description: "Approval date (null until approved)."
        expr: order_approved_date_key
        data_type: DATE
      - name: order_delivered_carrier_date_key
        description: "Carrier-handoff date (null until handed off)."
        expr: order_delivered_carrier_date_key
        data_type: DATE
      - name: order_delivered_customer_date_key
        description: "Delivery-to-customer date (null if not delivered)."
        expr: order_delivered_customer_date_key
        data_type: DATE
      - name: order_estimated_delivery_date_key
        description: "Estimated delivery date."
        expr: order_estimated_delivery_date_key
        data_type: DATE
      - name: order_purchase_timestamp
        description: "Purchase event time (intra-day precision / recency ordering)."
        expr: order_purchase_timestamp
        data_type: TIMESTAMP_NTZ
    facts:
      - name: delay_days
        description: "Delivered minus estimated delivery, in days. NULL = not delivered, > 0 = late. Delivery status derives from this column."
        expr: delay_days
        data_type: NUMBER
      - name: approval_delay_days
        description: "Days between purchase and approval."
        expr: approval_delay_days
        data_type: NUMBER
      - name: purchase_to_delivery_days
        description: "Days between purchase and delivery to customer."
        expr: purchase_to_delivery_days
        data_type: NUMBER
    metrics:
      - name: order_count
        synonyms: ["orders", "number of orders", "order volume"]
        description: "Number of distinct orders. Always COUNT(DISTINCT order_id) — never COUNT(*) — when combined with tables that have multiple rows per order (items, payments, bridge). Non-additive. Integer."
        expr: COUNT(DISTINCT order_id)
      - name: unique_customer_count
        synonyms: ["customers", "distinct customers", "buyers"]
        description: "Number of distinct physical customers (customer_unique_id, not order-scoped customer_id). Non-additive. Integer."
        expr: COUNT(DISTINCT customer_unique_id)
      - name: late_delivery_rate
        synonyms: ["late rate", "delivery delay rate"]
        description: "Share of delivered orders that arrived after the estimated date (delay_days > 0). Denominator is delivered orders only (delay_days is not null). Ratio of aggregates. Percentage."
        expr: "COUNT_IF(delay_days > 0) / NULLIF(COUNT_IF(delay_days IS NOT NULL), 0)"

  - name: order_items
    description: "Order-item fact at (order_id x order_item_id) grain — the base table for merchandise revenue. Thin fact: it carries NO order date; time-based revenue analysis goes through the relationship to orders. Multiple item rows per order: count orders with COUNT(DISTINCT order_id)."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: FCT_ORDER_ITEMS
    primary_key:
      columns: [ORDER_ITEM_KEY]
    dimensions:
      - name: order_item_key
        description: "Synthetic key (order_id-order_item_id)."
        expr: order_item_key
        data_type: VARCHAR
        unique: true
      - name: order_id
        description: "Order identifier."
        expr: order_id
        data_type: VARCHAR
      - name: product_id
        description: "Product identifier."
        expr: product_id
        data_type: VARCHAR
      - name: seller_id
        description: "Seller identifier."
        expr: seller_id
        data_type: VARCHAR
      - name: order_item_id
        description: "Item sequence number within the order (not unique alone)."
        expr: order_item_id
        data_type: NUMBER
    time_dimensions:
      - name: shipping_limit_date_key
        description: "Seller shipping-limit date."
        expr: shipping_limit_date_key
        data_type: DATE
    facts:
      - name: item_revenue
        description: "Merchandise revenue (ORDER_ITEMS.PRICE), excludes freight."
        expr: item_revenue
        data_type: NUMBER
      - name: freight_value
        description: "Freight charged for the item."
        expr: freight_value
        data_type: NUMBER
      - name: item_value_with_freight
        description: "Item value including freight: item_revenue + freight_value (derived, not stored)."
        expr: "item_revenue + freight_value"
        data_type: NUMBER
    metrics:
      - name: total_merchandise_revenue
        synonyms: ["revenue", "sales", "gmv", "turnover", "net sales"]
        description: "Sum of item-level merchandise revenue (excludes freight). This is merchandise revenue, NOT collected payment value. Additive. Currency."
        expr: SUM(item_revenue)
      - name: total_freight
        synonyms: ["shipping cost", "freight"]
        description: "Sum of freight charged. Additive. Currency."
        expr: SUM(freight_value)
      - name: average_order_value
        synonyms: ["aov", "average basket"]
        description: "Merchandise revenue divided by number of distinct orders. Ratio of aggregates; never average a per-order value. Non-additive. Currency."
        expr: "SUM(item_revenue) / NULLIF(COUNT(DISTINCT order_id), 0)"

  - name: payments
    description: "Payment fact at (order_id x payment_sequential) grain. payment_value is the COLLECTED value including freight and adjustments — distinct from merchandise revenue; do not present it as revenue. Multiple payment rows per order: count orders with COUNT(DISTINCT order_id)."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: FCT_ORDER_PAYMENTS
    primary_key:
      columns: [ORDER_PAYMENT_KEY]
    dimensions:
      - name: order_payment_key
        description: "Synthetic key for one payment row."
        expr: order_payment_key
        data_type: VARCHAR
        unique: true
      - name: order_id
        description: "Order identifier."
        expr: order_id
        data_type: VARCHAR
      - name: payment_sequential
        description: "Payment sequence within the order."
        expr: payment_sequential
        data_type: NUMBER
      - name: payment_type
        synonyms: ["payment method"]
        description: "Payment method."
        expr: payment_type
        data_type: VARCHAR
        is_enum: true
        sample_values: ["credit_card", "boleto", "voucher", "debit_card"]
      - name: installment_bucket
        description: "Installment bucket DERIVED from payment_installments: single (1), 2_to_3, 4_to_6, 7_to_12, 13_plus."
        expr: "CASE WHEN payment_installments <= 1 THEN 'single' WHEN payment_installments BETWEEN 2 AND 3 THEN '2_to_3' WHEN payment_installments BETWEEN 4 AND 6 THEN '4_to_6' WHEN payment_installments BETWEEN 7 AND 12 THEN '7_to_12' ELSE '13_plus' END"
        data_type: VARCHAR
        is_enum: true
        sample_values: ["single", "2_to_3", "4_to_6", "7_to_12", "13_plus"]
    facts:
      - name: payment_installments
        description: "Number of installments."
        expr: payment_installments
        data_type: NUMBER
      - name: payment_value
        description: "Collected payment value (incl. freight/adjustments)."
        expr: payment_value
        data_type: NUMBER
    metrics:
      - name: total_payment_value
        synonyms: ["collected value", "payments", "amount paid"]
        description: "Sum of collected payment value (includes freight and adjustments). Distinct from merchandise revenue: use only when the question is about money collected. Additive. Currency."
        expr: SUM(payment_value)

  - name: reviews
    description: "Review fact at (review_id, order_id) grain. Reviews are ORDER-level, not item-level. Attributing reviews to product categories through order_categories counts one review once per category in the order — disclose that attribution. A negative review is review_score <= 2."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: FCT_ORDER_REVIEWS
    primary_key:
      columns: [ORDER_REVIEW_KEY]
    dimensions:
      - name: order_review_key
        description: "Synthetic key for one review/order row."
        expr: order_review_key
        data_type: VARCHAR
        unique: true
      - name: order_id
        description: "Order identifier."
        expr: order_id
        data_type: VARCHAR
      - name: review_id
        description: "Review identifier."
        expr: review_id
        data_type: VARCHAR
      - name: review_comment_title
        description: "Free-text review title (often null)."
        expr: review_comment_title
        data_type: VARCHAR
      - name: review_comment_message
        description: "Free-text review message (often null)."
        expr: review_comment_message
        data_type: VARCHAR
      - name: is_negative_review
        description: "True when review_score <= 2 (derived, not stored)."
        expr: "review_score <= 2"
        data_type: BOOLEAN
        labels: [filter]
    time_dimensions:
      - name: review_creation_date_key
        description: "Review creation date."
        expr: review_creation_date_key
        data_type: DATE
      - name: review_answer_date_key
        description: "Review answer date (null if unanswered)."
        expr: review_answer_date_key
        data_type: DATE
    facts:
      - name: review_score
        description: "Review score from 1 to 5."
        expr: review_score
        data_type: NUMBER
    metrics:
      - name: average_review_score
        synonyms: ["rating", "satisfaction", "csat"]
        description: "Mean review score (1-5). Non-additive. Decimal."
        expr: AVG(review_score)
      - name: negative_review_rate
        synonyms: ["bad review rate", "dissatisfaction rate"]
        description: "Share of reviews with score <= 2. Ratio of aggregates, not an average of row-level flags. Non-additive. Percentage."
        expr: "COUNT_IF(review_score <= 2) / NULLIF(COUNT(*), 0)"

  # ─── CONFORMED DIMENSIONS ───────────────────────────────────────────────────

  - name: customers
    description: "Conformed PHYSICAL customer dimension at customer_unique_id grain. Deliberately thin (Olist has no stable customer attribute; per-order geography lives on orders). Anchor for distinct-customer counting and repeat-purchase analysis."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_CUSTOMERS
    primary_key:
      columns: [CUSTOMER_UNIQUE_ID]
    dimensions:
      - name: customer_unique_id
        description: "Physical customer identifier."
        expr: customer_unique_id
        data_type: VARCHAR
        unique: true

  - name: customer_geography
    description: "Customer-location role of the conformed geography dimension (zip-code-prefix grain), reached from orders. Some zip prefixes have no geolocation source row: city/state/coordinates are null for them."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_GEOGRAPHY
    primary_key:
      columns: [ZIP_CODE_PREFIX]
    dimensions:
      - name: customer_zip_code_prefix
        description: "Brazilian zip-code prefix (customer location)."
        expr: zip_code_prefix
        data_type: VARCHAR
        unique: true
      - name: customer_city
        description: "Customer city."
        expr: city
        data_type: VARCHAR
      - name: customer_state
        synonyms: ["customer uf"]
        description: "Customer Brazilian state code."
        expr: state
        data_type: VARCHAR
      - name: customer_latitude
        description: "Zip-prefix centroid latitude."
        expr: latitude
        data_type: NUMBER
      - name: customer_longitude
        description: "Zip-prefix centroid longitude."
        expr: longitude
        data_type: NUMBER

  - name: seller_geography
    description: "Seller-location role of the conformed geography dimension (zip-code-prefix grain), reached from sellers. Some zip prefixes have no geolocation source row: city/state/coordinates are null for them."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_GEOGRAPHY
    primary_key:
      columns: [ZIP_CODE_PREFIX]
    dimensions:
      - name: seller_zip_code_prefix
        description: "Brazilian zip-code prefix (seller location)."
        expr: zip_code_prefix
        data_type: VARCHAR
        unique: true
      - name: seller_city
        description: "Seller city."
        expr: city
        data_type: VARCHAR
      - name: seller_state
        synonyms: ["seller uf"]
        description: "Seller Brazilian state code."
        expr: state
        data_type: VARCHAR
      - name: seller_latitude
        description: "Zip-prefix centroid latitude."
        expr: latitude
        data_type: NUMBER
      - name: seller_longitude
        description: "Zip-prefix centroid longitude."
        expr: longitude
        data_type: NUMBER

  - name: categories
    description: "Conformed product-category dimension keyed on the Portuguese category name (canonical category key), with the English translation. Referenced by products and the order_categories bridge."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_CATEGORIES
    primary_key:
      columns: [PRODUCT_CATEGORY_NAME]
    dimensions:
      - name: product_category_name
        description: "Portuguese category name (canonical category key)."
        expr: product_category_name
        data_type: VARCHAR
        unique: true
      - name: product_category_name_english
        synonyms: ["category"]
        description: "English category name (null when untranslated) — preferred display name."
        expr: product_category_name_english
        data_type: VARCHAR
      - name: has_english_category
        description: "True when an English translation exists."
        expr: has_english_category
        data_type: BOOLEAN
        labels: [filter]

  - name: products
    description: "Product dimension with physical attributes. Category is snowflaked to the categories table via product_category_name."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_PRODUCTS
    primary_key:
      columns: [PRODUCT_ID]
    dimensions:
      - name: product_id
        description: "Product identifier."
        expr: product_id
        data_type: VARCHAR
        unique: true
      - name: product_category_name
        description: "Portuguese category (may be null)."
        expr: product_category_name
        data_type: VARCHAR
      - name: product_name_length
        description: "Length of the product name."
        expr: product_name_length
        data_type: NUMBER
      - name: product_description_length
        description: "Length of the product description."
        expr: product_description_length
        data_type: NUMBER
    facts:
      - name: product_photos_qty
        description: "Number of product photos."
        expr: product_photos_qty
        data_type: NUMBER
      - name: product_weight_g
        description: "Product weight in grams."
        expr: product_weight_g
        data_type: NUMBER
      - name: product_length_cm
        description: "Product length in cm."
        expr: product_length_cm
        data_type: NUMBER
      - name: product_height_cm
        description: "Product height in cm."
        expr: product_height_cm
        data_type: NUMBER
      - name: product_width_cm
        description: "Product width in cm."
        expr: product_width_cm
        data_type: NUMBER

  - name: sellers
    description: "Seller dimension. Geography (city/state/coordinates) is reached via seller_geography on seller_zip_code_prefix."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: DIM_SELLERS
    primary_key:
      columns: [SELLER_ID]
    dimensions:
      - name: seller_id
        description: "Seller identifier."
        expr: seller_id
        data_type: VARCHAR
        unique: true
      - name: seller_zip_code_prefix
        description: "Seller zip prefix (seller-location role of geography)."
        expr: seller_zip_code_prefix
        data_type: VARCHAR

  # ─── BRIDGE ─────────────────────────────────────────────────────────────────

  - name: order_categories
    description: "Keys-only bridge resolving the order/category many-to-many at (order_id x category) grain. Use it to slice ORDER-LEVEL facts (order counts, reviews) by category without item fan-out; an order with N categories yields N rows, so order-level counting still needs COUNT(DISTINCT order_id). It carries NO measures: category revenue comes from order_items via product -> category. allocation_weight (1/N) allocates an order-level measure across categories without double counting — disclose the allocation."
    base_table:
      database: PULSAR_DB
      schema: GOLD
      table: BRIDGE_ORDER_CATEGORIES
    primary_key:
      columns: [ORDER_CATEGORY_KEY]
    dimensions:
      - name: order_category_key
        description: "Synthetic key for one order/category membership row."
        expr: order_category_key
        data_type: VARCHAR
        unique: true
      - name: order_id
        description: "Order identifier."
        expr: order_id
        data_type: VARCHAR
      - name: product_category_name
        description: "Portuguese category present in the order."
        expr: product_category_name
        data_type: VARCHAR
    facts:
      - name: allocation_weight
        description: "1 / number of categories in the order — weighting factor for allocating order-level measures across categories without double counting."
        expr: allocation_weight
        data_type: NUMBER

# ─── RELATIONSHIPS (exhaustive: one per FK edge of the star) ──────────────────

relationships:

  - name: orders_to_customers
    left_table: orders
    right_table: customers
    relationship_columns:
      - left_column: customer_unique_id
        right_column: customer_unique_id

  - name: orders_to_customer_geography
    left_table: orders
    right_table: customer_geography
    relationship_columns:
      - left_column: customer_zip_code_prefix
        right_column: customer_zip_code_prefix

  - name: order_items_to_orders
    left_table: order_items
    right_table: orders
    relationship_columns:
      - left_column: order_id
        right_column: order_id

  - name: order_items_to_products
    left_table: order_items
    right_table: products
    relationship_columns:
      - left_column: product_id
        right_column: product_id

  - name: order_items_to_sellers
    left_table: order_items
    right_table: sellers
    relationship_columns:
      - left_column: seller_id
        right_column: seller_id

  - name: products_to_categories
    left_table: products
    right_table: categories
    relationship_columns:
      - left_column: product_category_name
        right_column: product_category_name

  - name: sellers_to_seller_geography
    left_table: sellers
    right_table: seller_geography
    relationship_columns:
      - left_column: seller_zip_code_prefix
        right_column: seller_zip_code_prefix

  - name: payments_to_orders
    left_table: payments
    right_table: orders
    relationship_columns:
      - left_column: order_id
        right_column: order_id

  - name: reviews_to_orders
    left_table: reviews
    right_table: orders
    relationship_columns:
      - left_column: order_id
        right_column: order_id

  - name: order_categories_to_orders
    left_table: order_categories
    right_table: orders
    relationship_columns:
      - left_column: order_id
        right_column: order_id

  - name: order_categories_to_categories
    left_table: order_categories
    right_table: categories
    relationship_columns:
      - left_column: product_category_name
        right_column: product_category_name

# ─── VERIFIED QUERIES (strict parity: 1, same as the pulsar_bare example) ─────

verified_queries:
  - name: total_merchandise_revenue_by_month
    question: "What is total merchandise revenue by month?"
    use_as_onboarding_question: false
    sql: "SELECT DATE_TRUNC('month', o.order_purchase_date_key) AS month, SUM(oi.item_revenue) AS total_merchandise_revenue FROM __order_items AS oi JOIN __orders AS o ON oi.order_id = o.order_id GROUP BY 1 ORDER BY 1"

# ─── CUSTOM INSTRUCTIONS (transposable subset of the pulsar conventions/rules) ─

module_custom_instructions:
  sql_generation: "Revenue means MERCHANDISE revenue: the total_merchandise_revenue metric (sum of item_revenue, excludes freight). It is NOT payment_value (collected value, includes freight and adjustments) — choose deliberately and state which one was used. 'Customers' means physical customers (customer_unique_id), not the order-scoped customer_id. The canonical category key is the Portuguese product_category_name; product_category_name_english is the preferred display name. Prefer the defined metrics over ad-hoc aggregations of facts. Reviews and order counts attributed to categories through order_categories count one order once per category present in the order; disclose this attribution."
