# Full Pulsar stack: Cube semantic layer + Streamlit UI.
#
# Prerequisites:
#   1. cube/.env created from cube/example.env (Snowflake credentials + CUBEJS_API_SECRET)
#   2. .env created from .env.example (CUBE_API_TOKEN + ANTHROPIC_API_KEY)
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose logs -f pulsar-ui  # follow UI logs
#   docker compose down               # stop

services:

  cube:
    image: cubejs/cube:latest
    env_file:
      - path: cube/.env
        required: false
    environment:
      - CUBEJS_DEV_MODE=true
    ports:
      - "4000:4000"
      - "15432:15432"
    volumes:
      # Mount cube config from the workspace (model/, package.json, example.env)
      - ./cube:/cube/conf

  pulsar-ui:
    build:
      context: .
      dockerfile: pulsar-ui/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Service-to-service URL — resolved via Docker internal DNS.
      # Overrides any CUBE_API_URL set in .env.
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
    ports:
      - "8501:8501"
    depends_on:
      - cube
