[project]
name = "fieldops-generator"
version = "0.1.0"
description = "Deterministic synthetic-data generator for the FieldOps benchmark: simulates the operational (silver) layer and runs the divergence pre-flight checks (FIELDOPS_SPEC.md §6)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
fieldops-generate = "fieldops_generator.cli:main"
fieldops-eval-build = "fieldops_generator.evalbuild:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldops_generator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
