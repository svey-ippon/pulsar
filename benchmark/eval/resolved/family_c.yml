  kind: control
  capability: 'multi-hop navigation: lines -> work_orders -> sites -> geography (site role); doubles as
    the control of C3-T'
  question: Which 3 states generated the most service revenue in 2019?
  requires_conventions:
  - CV-1
  - GC-REV-ANCHOR
  pass_criterion: numeric
  tolerance:
    mode: relative
    value: 0.005
  answer_format: top 3 (state, revenue), ranking must match
  certified_sql: |
    with wo_rev as (
        select
            wo.work_order_id,
            wo.site_id,
            wo.completed_date_key,
            coalesce(sum(l.line_amount), 0) + any_value(wo.call_out_fee) as revenue
        from PULSAR_DB.FIELDOPS_GOLD.FCT_WORK_ORDERS as wo
        left join PULSAR_DB.FIELDOPS_GOLD.FCT_WORK_ORDER_LINES as l
            on wo.work_order_id = l.work_order_id
        where wo.completed_date_key is not null
        group by wo.work_order_id, wo.site_id, wo.completed_date_key
    )
    select g.state, round(sum(r.revenue), 2) as revenue
    from wo_rev as r
    inner join PULSAR_DB.FIELDOPS_GOLD.DIM_SITES as s on r.site_id = s.site_id
    inner join PULSAR_DB.FIELDOPS_GOLD.DIM_GEOGRAPHY as g
        on s.site_zip_code_prefix = g.zip_code_prefix
    where r.completed_date_key >= '2019-01-01' and r.completed_date_key < '2020-01-01'
    group by g.state
    order by revenue desc
    limit 3
  expected_answer:
