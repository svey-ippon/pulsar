[project]
name = "pulsar-app"
version = "0.1.0"
description = "Streamlit UI for the Pulsar data-agent POC"
requires-python = ">=3.12"
dependencies = [
    "pulsar-agent",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyyaml>=6.0.2",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.2",
]

[tool.uv.workspace]
members = ["pulsar_agent"]

[tool.uv.sources]
pulsar-agent = { workspace = true }

[tool.pytest.ini_options]
# Run both the app tests and the agent tests from the workspace root
testpaths = ["tests", "pulsar_agent/tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
