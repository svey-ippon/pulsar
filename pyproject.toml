[project]
name = "pulsar-workspace"
version = "0.1.0"
description = "Workspace root — integration point and shared dev tooling"
requires-python = ">=3.12"
dependencies = [
    "pulsar-agent",
    "pulsar-ui",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.2",
    "pyyaml>=6.0.2",
]

[tool.uv.workspace]
members = ["pulsar-agent", "pulsar-ui"]

[tool.uv.sources]
pulsar-agent = { workspace = true }
pulsar-ui = { workspace = true }

[tool.pytest.ini_options]
# Full workspace suite: infra tests + agent tests + UI tests
testpaths = ["tests", "pulsar-agent/tests", "pulsar-ui/tests"]
addopts = "--import-mode=importlib"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
