- id: D3-T
  family: D
  kind: trap
  capability: 'survey grain: the LATEST response per work order counts'
  question: What is our average client satisfaction score?
  control_id: D3-C
  requires_conventions:
  - GC-SURVEY-LATEST
  pass_criterion: numeric
  tolerance:
    mode: absolute
    value: 0.05
  certified_sql: |
    select round(avg(satisfaction_score), 2) as answer
    from (
        select satisfaction_score
        from PULSAR_DB.FIELDOPS_GOLD.FCT_SATISFACTION_SURVEYS
        qualify
            row_number() over (
                partition by work_order_id order by response_sequence desc
            )
            = 1
    )
  expected_answer: 7.76
  naive_signatures:
  - indicates: D3
    description: naive AVG over every response row (re-surveyed WOs double-counted)
    sql: |
      select round(avg(satisfaction_score), 2) as answer
      from PULSAR_DB.FIELDOPS_GOLD.FCT_SATISFACTION_SURVEYS
    value: 7.43
    diverges: true
- id: D3-C
  family: D
  kind: control
  capability: COUNT DISTINCT over the survey fact
  question: How many work orders received at least one satisfaction survey response?
  pass_criterion: numeric
  tolerance:
    mode: exact
  certified_sql: |
    select count(distinct work_order_id) as answer
    from PULSAR_DB.FIELDOPS_GOLD.FCT_SATISFACTION_SURVEYS
  expected_answer: 5038
