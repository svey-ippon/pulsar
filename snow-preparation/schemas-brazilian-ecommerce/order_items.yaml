table: order_items
source_file: olist_order_items_dataset.csv
description: |
  This dataset includes data about the items purchased within each order.
  ## Example:
  - The order_id = 00143d0f86d6fbd9f9b38ab440ac16f5 has 3 items (same product). Each item has the freight calculated accordingly to its measures and weight. To get the total freight value for each order you just have to sum.
  - The total order_item value is: 21.33 * 3 = 63.99
  - The total freight value is: 15.10 * 3 = 45.30
  - The total order value (product + freight) is: 45.30 + 63.99 = 109.29
columns:
- name: order_id
  type: VARCHAR
  description: 'order unique identifier'
- name: order_item_id
  type: VARCHAR
  description: 'sequential number identifying number of items included in the same order.'
- name: product_id
  type: VARCHAR
  description: 'product unique identifier'
- name: seller_id
  type: VARCHAR
  description: 'seller unique identifier'
- name: shipping_limit_date
  type: TIMESTAMP_NTZ
  description: 'Shows the seller shipping limit date for handling the order over to the logistic partner.'
- name: price
  type: FLOAT
  description: 'item price'
- name: freight_value
  type: FLOAT
  description: 'item freight value item (if an order has more than one item the freight value is splitted between items)'
