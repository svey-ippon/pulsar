name: transformations
version: "1.0.0"
config-version: 2

profile: transformations

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transformations:
    +persist_docs:
      relation: true
      columns: true
    +database: PULSAR_DB
    +transient: false
    +materialized: table
    +query_tag: "true - value set by set_query_tag() macro"

    gold:
      +schema: GOLD

      # Marts are downstream CONSUMERS of the core star. They still read columns
      # the pure-Kimball redesign removed from the facts, so they are disabled
      # until reworked. See docs/GOLD_MODEL_TARGET.md.
      marts:
        +enabled: false

    # FieldOps synthetic benchmark star (see benchmark/FIELDOPS_SPEC.md).
    # Models are named fieldops_* (dbt model names are project-global) and
    # aliased back to plain star names inside the dedicated schema.
    fieldops_gold:
      +schema: FIELDOPS_GOLD
      +tags: [fieldops]

seeds:
  transformations:
    # FieldOps generated silver layer (written by benchmark/generator; committed).
    fieldops:
      +database: PULSAR_DB
      +schema: FIELDOPS_SILVER
      +tags: [fieldops]
