name: transformations
version: "1.0.0"
config-version: 2

profile: transformations

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transformations:
    +persist_docs:
      relation: true
      columns: true
    +database: ECOMMERCE_DB
    +transient: false
    +materialized: table
    +query_tag: "true - value set by set_query_tag() macro"

    gold:
      +schema: GOLD
