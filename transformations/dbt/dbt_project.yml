name: transformations
version: "1.0.0"
config-version: 2

profile: transformations

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  transformations:
    +persist_docs:
      relation: true
      columns: true
    +database: ECOMMERCE_DB

    gold:
      +schema: GOLD
      +materialized: table

