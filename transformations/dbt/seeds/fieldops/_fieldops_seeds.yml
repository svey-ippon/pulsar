version: 2

# FieldOps operational (silver) layer — generated by benchmark/generator
# (deterministic, seeded; see benchmark/FIELDOPS_SPEC.md). These seeds ARE the
# silver: the gold star in models/fieldops_gold builds on them.
# column_types pins the loaded types (zip prefixes must stay text).

seeds:
  - name: fieldops_geography
    description: "Fictional geography referential: zip prefix -> city, state."
    config:
      column_types:
        zip_code_prefix: varchar
        city: varchar
        state: varchar

  - name: fieldops_clients
    description: "Contract-holding client companies (the FieldOps 'customer' of record)."
    config:
      column_types:
        client_id: varchar
        client_name: varchar
        industry: varchar
        contract_tier: varchar

  - name: fieldops_sites
    description: "Client locations where interventions happen."
    config:
      column_types:
        site_id: varchar
        client_id: varchar
        site_name: varchar
        site_type: varchar
        zip_code_prefix: varchar

  - name: fieldops_depots
    description: "Dispatch depots (one per state)."
    config:
      column_types:
        depot_code: varchar
        zip_code_prefix: varchar

  - name: fieldops_technicians
    description: "Technicians, each attached to a dispatch depot."
    config:
      column_types:
        technician_id: varchar
        depot_code: varchar
        seniority_level: varchar

  - name: fieldops_equipment_categories
    description: "Equipment category referential."
    config:
      column_types:
        equipment_category: varchar
        category_group: varchar

  - name: fieldops_equipment_units
    description: "Installed equipment units per site (silver-only: not exposed in gold; grounds the work_order <-> category bridge)."
    config:
      column_types:
        equipment_unit_id: varchar
        site_id: varchar
        equipment_category: varchar
        serial_number: varchar
        installed_date: date

  - name: fieldops_parts
    description: "Spare-parts catalogue (list_price is silver-only)."
    config:
      column_types:
        part_id: varchar
        part_name: varchar
        part_family: varchar
        list_price: number(12,2)

  - name: fieldops_work_orders
    description: "Work orders with their lifecycle milestones (opened -> promised -> scheduled -> started -> completed -> validated). NULL milestone = not reached yet."
    config:
      column_types:
        work_order_id: varchar
        site_id: varchar
        technician_id: varchar
        work_order_type: varchar
        priority: varchar
        crew_size: number(2,0)
        opened_date: date
        promised_date: date
        scheduled_date: date
        started_date: date
        completed_date: date
        validated_date: date
        duration_hours: number(6,2)
        call_out_fee: number(12,2)

  - name: fieldops_work_order_lines
    description: "Intervention lines: PART lines (part_id, quantity) and LABOR lines (billed_hours). part_id is NULL on LABOR lines."
    config:
      column_types:
        work_order_id: varchar
        line_number: number(4,0)
        line_kind: varchar
        part_id: varchar
        quantity: number(4,0)
        billed_hours: number(8,2)
        line_amount: number(12,2)

  - name: fieldops_work_order_servicing
    description: "Equipment units serviced by each work order (silver-only; source of the gold bridge)."
    config:
      column_types:
        work_order_id: varchar
        equipment_unit_id: varchar

  - name: fieldops_payments
    description: "Payments settling the work-order invoice (lines + call-out fee), with a collection lag; partial payments possible."
    config:
      column_types:
        work_order_id: varchar
        payment_sequence: number(2,0)
        payment_method: varchar
        paid_date: date
        payment_amount: number(12,2)

  - name: fieldops_surveys
    description: "Post-intervention satisfaction survey responses (1-10); several responses per work order possible (re-surveys)."
    config:
      column_types:
        work_order_id: varchar
        response_sequence: number(2,0)
        responded_date: date
        satisfaction_score: number(2,0)
