version: 2

models:
  - name: bridge_order_categories
    description: "Bridge at order plus English category grain."
    config:
      meta:
        grain: "order_id, product_category_name_english"
        why: "Deduplicates category membership inside an order and prevents category analysis from multiplying order-level facts by item rows."
        layer: gold
        model_type: bridge
    columns:
      - name: order_category_key
        description: "Synthetic key for one order/category membership row."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_category_name_english
        description: "English category present in the order."
        data_tests:
          - not_null

