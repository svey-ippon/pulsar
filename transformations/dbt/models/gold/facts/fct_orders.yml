version: 2

models:
  - name: fct_orders
    description: "Order fact at order_id grain with customer identity, lifecycle timestamps, and delivery-delay facts."
    config:
      meta:
        grain: "order_id"
        why: "Centralizes order lifecycle and delivery status logic before semantic exposure."
        model_type: fact
        business_conventions:
          - "delay_days > 0 means late delivery."
          - "customer_unique_id is used for physical-customer analytics."
    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Order-scoped customer key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: customer_unique_id
        description: "Physical customer identifier."
      - name: delivery_late_status
        description: "Binary delivery status: late, on_time, or not_delivered."
        data_tests:
          - accepted_values:
              arguments:
                values: ['late', 'on_time', 'not_delivered']
      - name: delivery_status
        description: "Detailed delivery status: on_time, late, very_late, or not_delivered."
        data_tests:
          - accepted_values:
              arguments:
                values: ['on_time', 'late', 'very_late', 'not_delivered']

