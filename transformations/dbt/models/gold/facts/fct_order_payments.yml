version: 2

models:
  - name: fct_order_payments
    description: "Payment fact at order_id plus payment_sequential grain."
    config:
      meta:
        grain: "order_id, payment_sequential"
        why: "Separates collected payment value from merchandise revenue."
        layer: gold
        model_type: fact
        business_conventions:
          - "payment_value is collected value including freight and adjustments."
    columns:
      - name: order_payment_key
        description: "Synthetic key for one payment row."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: payment_type
        description: "Payment method."
      - name: installment_bucket
        description: "Bucketed maximum installment count."
        data_tests:
          - accepted_values:
              arguments:
                values: ['single', '2_to_3', '4_to_6', '7_to_12', '13_plus']

