version: 2

models:
  - name: fct_order_payments
    description: "Payment fact at order_id plus payment_sequential grain (thin Kimball fact: keys + degenerate dims + measures)."
    config:
      meta:
        grain: "order_id, payment_sequential"
        why: "Separates collected payment value from merchandise revenue. Installment banding is derived downstream from payment_installments."
        model_type: fact
        business_conventions:
          - "payment_value is collected value including freight and adjustments."
    columns:
      - name: order_payment_key
        description: "Synthetic key for one payment row."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier; foreign key to fct_orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: payment_type
        description: "Payment method (degenerate dimension): credit_card, boleto, voucher, debit_card."
      - name: payment_installments
        description: "Number of installments."
      - name: payment_value
        description: "Collected payment value including freight and adjustments."
