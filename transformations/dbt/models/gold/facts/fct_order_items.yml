version: 2

models:
  - name: fct_order_items
    description: "Order-item fact at order_id plus order_item_id grain."
    config:
      meta:
        grain: "order_id, order_item_id"
        why: "Defines governed merchandise revenue. item_revenue excludes freight and payment adjustments."
        layer: gold
        model_type: fact
        business_conventions:
          - "item_revenue is merchandise revenue from ORDER_ITEMS.PRICE."
    columns:
      - name: order_item_key
        description: "Synthetic key for one order item."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Product identifier."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: item_revenue
        description: "Merchandise revenue excluding freight and payment adjustments."

