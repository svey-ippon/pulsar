version: 2

models:
  - name: mart_monthly_revenue
    description: "Monthly delivered merchandise revenue mart with period-over-period growth."
    config:
      meta:
        grain: "order_purchase_month"
        why: "Keeps common time-series logic stable and prevents payment value from being confused with merchandise revenue."
        model_type: mart
    columns:
      - name: order_purchase_month
        description: "Revenue month based on order purchase timestamp."
        data_tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Delivered merchandise revenue for the month."
      - name: revenue_growth_pct
        description: "Month-over-month delivered merchandise revenue growth percentage."

