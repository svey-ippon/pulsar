version: 2

models:
  - name: mart_state_seller_revenue_share
    description: "Seller share of local delivered merchandise revenue by customer state."
    config:
      meta:
        grain: "customer_state, seller_id"
        why: "Ranks sellers within each customer state by delivered local revenue share."
        model_type: mart
        business_conventions:
          - "customer_state is the buyer state, not the seller state."
    columns:
      - name: customer_state
        description: "Customer state code."
        data_tests:
          - not_null
      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: seller_rank_in_customer_state
        description: "Seller rank inside the customer state by delivered merchandise revenue."

