version: 2

models:
  - name: mart_delivery_distance
    description: "Seller-to-customer distance mart at order-item grain."
    config:
      meta:
        grain: "order_id, order_item_id"
        why: "Computes approximate great-circle distance from representative zip-prefix coordinates for logistics analysis."
        model_type: mart
    columns:
      - name: order_item_key
        description: "Synthetic key for one order item."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_order_items')
                field: order_item_key
      - name: seller_customer_distance_km
        description: "Approximate seller-to-customer distance in kilometers."

