version: 2

models:
  - name: mart_seller_scorecard
    description: "Seller scorecard combining delivered revenue, revenue share, reviews, and delivery performance."
    config:
      meta:
        grain: "seller_id"
        why: "Supports top-seller and seller-quality questions with a single governed seller view."
        model_type: mart
        attribution: "Seller review score is based on distinct seller/order membership, not item rows."
    columns:
      - name: seller_id
        description: "Seller identifier."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: delivered_revenue
        description: "Delivered merchandise revenue generated by the seller."
      - name: revenue_rank
        description: "Seller rank by delivered merchandise revenue."

