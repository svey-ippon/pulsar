version: 2

models:
  - name: mart_category_satisfaction
    description: "Order-category review attribution mart."
    config:
      meta:
        grain: "order_id, product_category_name_english, review_id"
        why: "Attributes one order-level review once to each distinct English category in the order, avoiding review x item fan-out."
        layer: gold
        model_type: mart
        attribution: "One order review is attributed once to each distinct English category present in that order."
    columns:
      - name: category_review_key
        description: "Synthetic key for one category review attribution row."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Order identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: review_id
        description: "Review identifier."
        data_tests:
          - not_null
      - name: product_category_name_english
        description: "English category receiving the attributed review score."
        data_tests:
          - not_null

