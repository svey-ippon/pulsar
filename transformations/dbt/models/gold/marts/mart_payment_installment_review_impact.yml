version: 2

models:
  - name: mart_payment_installment_review_impact
    description: "Installment bucket impact mart with payment value and negative review rate."
    config:
      meta:
        grain: "max_installment_bucket"
        why: "Aggregates payment value and review outcomes by installment bucket while avoiding direct payment x item joins."
        layer: gold
        model_type: mart
    columns:
      - name: max_installment_bucket
        description: "Bucket of the maximum installment count used by an order."
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['single', '2_to_3', '4_to_6', '7_to_12', '13_plus']
      - name: total_collected_value
        description: "Collected payment value for the bucket."
      - name: negative_review_rate
        description: "Share of reviews in the bucket with review_score <= 2."

