version: 2

models:
  - name: mart_customer_cohorts
    description: "Monthly customer acquisition cohorts with 90-day and 180-day retention."
    config:
      meta:
        grain: "cohort_month"
        why: "Precomputes physical-customer cohort logic so semantic tools do not rebuild retention flags per query."
        layer: gold
        model_type: mart
        business_conventions:
          - "Customers are identified by customer_unique_id."
          - "A retained customer has another order after first order within the retention window."
    columns:
      - name: cohort_month
        description: "Month of the customer's first observed order."
        data_tests:
          - not_null
          - unique
      - name: cohort_size
        description: "Number of physical customers acquired in the cohort month."
      - name: retained_90d
        description: "Customers with a second order within 90 days."
      - name: retained_180d
        description: "Customers with a second order within 180 days."

