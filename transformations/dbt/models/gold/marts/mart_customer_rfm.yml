version: 2

models:
  - name: mart_customer_rfm
    description: "Customer-level RFM-style mart for recency, frequency, value, and review score."
    config:
      meta:
        grain: "customer_unique_id"
        why: "Supports at-risk customer analysis and customer health segmentation."
        model_type: mart
    columns:
      - name: customer_unique_id
        description: "Physical customer identifier."
        data_tests:
          - not_null
          - unique
      - name: customer_health_segment
        description: "Derived customer health segment."
        data_tests:
          - accepted_values:
              arguments:
                values: ['at_risk', 'repeat', 'one_time']
      - name: days_since_last_order
        description: "Days between the customer's last order and the dataset max order date."

