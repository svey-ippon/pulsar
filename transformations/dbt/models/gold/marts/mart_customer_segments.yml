version: 2

models:
  - name: mart_customer_segments
    description: "Repeat vs one-time customer revenue segment mart."
    config:
      meta:
        grain: "customer_segment"
        why: "Segments physical customers before aggregating delivered merchandise revenue."
        layer: gold
        model_type: mart
    columns:
      - name: customer_segment
        description: "repeat for 2+ delivered orders, otherwise one_time."
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['repeat', 'one_time']
      - name: total_revenue
        description: "Delivered merchandise revenue generated by the segment."
      - name: pct_revenue
        description: "Share of delivered merchandise revenue generated by the segment."

