version: 2

models:
  - name: dim_products
    description: "Product dimension with physical attributes; category translation is snowflaked to dim_categories."
    config:
      meta:
        grain: "product_id"
        why: "Holds product physical attributes; references the conformed category dimension instead of carrying the English translation inline."
        model_type: dimension
    columns:
      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Portuguese product category; foreign key to dim_categories."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: product_category_name
      - name: product_weight_g
        description: "Product weight in grams."
      - name: product_photos_qty
        description: "Number of product photos."
