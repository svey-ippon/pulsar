version: 2

models:
  - name: dim_products
    description: "Product dimension with Portuguese source category and English category translation."
    config:
      meta:
        grain: "product_id"
        why: "Centralizes category translation so downstream models and semantic layers do not guess English names."
        model_type: dimension
    columns:
      - name: product_id
        description: "Product identifier."
        data_tests:
          - not_null
          - unique
      - name: product_category_name
        description: "Portuguese product category."
      - name: product_category_name_english
        description: "English product category from the translation table."

