version: 2

models:
  - name: dim_customers
    description: "Conformed physical customer dimension at customer_unique_id grain."
    config:
      meta:
        grain: "customer_unique_id"
        why: "Regrained from order-scoped customer_id to the physical customer; the conformed anchor for distinct-customer analysis. Order-scoped customer_id is a degenerate dimension on fct_orders."
        model_type: dimension
    columns:
      - name: customer_unique_id
        description: "Physical customer identifier; natural key."
        data_tests:
          - not_null
          - unique
